<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted domain discovery from operational evidence</title>
  <desc id="desc">Multiple evidence sources converge on an AI comparison step. The AI produces traceable candidate object hypotheses, while domain experts validate boundaries and send corrections back into the evidence set.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17212b; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52606d; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .source { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #52606d; }
      .core { font-size: 22px; font-weight: 700; }
      .output { font-size: 16px; font-weight: 650; }
      .flow { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #047857; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#green-arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <path d="M0 0 H1200 V10 H0 Z" fill="#0f766e"/>
  <text class="title" x="60" y="62">AI proposes the map. Evidence and experts govern it.</text>
  <text class="subtitle" x="60" y="92">Discovery compares possible behavior, observed behavior, and required behavior without silently resolving contradictions.</text>

  <text class="section" x="70" y="142" fill="#334155">OPERATIONAL EVIDENCE</text>
  <text class="section" x="492" y="142" fill="#7c3aed">COMPARISON</text>
  <text class="section" x="810" y="142" fill="#0f766e">TRACEABLE HYPOTHESES</text>

  <g transform="translate(60 170)">
    <rect width="230" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="28" cy="32" r="11" fill="#2563eb"/>
    <text class="source" x="52" y="28">Code and APIs</text>
    <text class="small" x="52" y="48">possible behavior</text>
  </g>
  <g transform="translate(60 252)">
    <rect width="230" height="64" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <circle cx="28" cy="32" r="11" fill="#047857"/>
    <text class="source" x="52" y="28">Events and audits</text>
    <text class="small" x="52" y="48">observed behavior</text>
  </g>
  <g transform="translate(60 334)">
    <rect width="230" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <circle cx="28" cy="32" r="11" fill="#c2410c"/>
    <text class="source" x="52" y="28">Policies and rules</text>
    <text class="small" x="52" y="48">required behavior</text>
  </g>
  <g transform="translate(60 416)">
    <rect width="230" height="64" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <circle cx="28" cy="32" r="11" fill="#be185d"/>
    <text class="source" x="52" y="28">Screens and forms</text>
    <text class="small" x="52" y="48">working vocabulary</text>
  </g>
  <g transform="translate(60 498)">
    <rect width="230" height="64" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <circle cx="28" cy="32" r="11" fill="#a16207"/>
    <text class="source" x="52" y="28">Tickets and exceptions</text>
    <text class="small" x="52" y="48">hidden work</text>
  </g>

  <path class="flow" d="M290 202 C390 202 390 260 474 286"/>
  <path class="flow" d="M290 284 H462"/>
  <path class="flow" d="M290 366 C390 366 390 330 462 314"/>
  <path class="flow" d="M290 448 C400 448 405 362 474 336"/>
  <path class="flow" d="M290 530 C420 530 430 392 492 352"/>

  <g transform="translate(462 206)">
    <path d="M70 0 H210 L280 115 L210 230 H70 L0 115 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text class="core" x="140" y="82" text-anchor="middle">AI comparison</text>
    <text class="small" x="140" y="111" text-anchor="middle">aliases + identities</text>
    <text class="small" x="140" y="134" text-anchor="middle">states + transitions</text>
    <text class="small" x="140" y="157" text-anchor="middle">owners + contradictions</text>
    <text class="small" x="140" y="188" text-anchor="middle" fill="#6d28d9">Every claim retains provenance</text>
  </g>

  <path class="flow" d="M742 321 H808"/>

  <g transform="translate(808 174)">
    <rect width="332" height="300" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
    <text class="core" x="24" y="42">Candidate domain object</text>
    <line x1="24" y1="58" x2="308" y2="58" stroke="#99f6e4" stroke-width="2"/>
    <text class="output" x="24" y="91">Identity</text>
    <text class="small" x="140" y="91">claim number</text>
    <text class="output" x="24" y="129">Lifecycle</text>
    <text class="small" x="140" y="129">reported, open, closed</text>
    <text class="output" x="24" y="167">Authority</text>
    <text class="small" x="140" y="167">claims administration</text>
    <text class="output" x="24" y="205">Events</text>
    <text class="small" x="140" y="205">ClaimReported</text>
    <text class="output" x="24" y="243">Evidence</text>
    <text class="small" x="140" y="243">API, history, procedure</text>
    <text class="output" x="24" y="281">Open question</text>
    <text class="small" x="140" y="281">Who owns reserve state?</text>
  </g>

  <g transform="translate(808 506)">
    <rect width="332" height="78" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text class="source" x="166" y="31" text-anchor="middle">Domain-owner validation</text>
    <text class="small" x="166" y="55" text-anchor="middle">confirm, split, merge, reject, or revise</text>
  </g>
  <path class="feedback" d="M974 474 V500"/>
  <path class="feedback" d="M808 545 C650 625 356 626 190 568"/>
  <text class="small" x="500" y="616" text-anchor="middle" fill="#047857">validated corrections return to the evidence set</text>
</svg>