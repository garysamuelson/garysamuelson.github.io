<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Where the action-to-object binding is resolved</title>
  <desc id="desc">Deterministic automation fixes the binding from action to object, transition, and record in code at design time, and each instance replays it at runtime. Agentic AI leaves the binding unresolved at design time; the agent resolves it case by case at runtime, governed by the domain model that enforces object ownership, valid transitions, and evidence obligations.</desc>
  <defs>
    <marker id="slate-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="orange-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17212b; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52606d; }
      .phase { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .lane { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .node-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #52606d; }
      .tag { font-size: 14px; fill: #9a3412; }
      .caption { font-size: 16px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <path d="M0 0 H1200 V10 H0 Z" fill="#4338ca"/>
  <text class="title" x="60" y="62">Where the action-to-object binding is resolved</text>
  <text class="subtitle" x="60" y="92">Deterministic code fixes it before any instance runs. An agent resolves it while the work runs.</text>

  <rect x="40" y="112" width="556" height="574" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="604" y="112" width="556" height="574" rx="16" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="2"/>
  <text class="phase" x="318" y="140" text-anchor="middle">DESIGN TIME — BEFORE ANY INSTANCE RUNS</text>
  <text class="phase" x="882" y="140" text-anchor="middle">RUNTIME — WHILE THE WORK RUNS</text>

  <!-- Lane A: Deterministic -->
  <text class="lane" x="70" y="182" fill="#1d4ed8">DETERMINISTIC AUTOMATION</text>

  <g>
    <rect x="70" y="196" width="300" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text class="node-title" x="88" y="228">Binding fixed in code</text>
    <line x1="88" y1="242" x2="352" y2="242" stroke="#bfdbfe" stroke-width="2"/>
    <text class="body" x="88" y="274">action → object</text>
    <text class="body" x="88" y="302">→ transition → record</text>
    <text class="small" x="88" y="332">Settled before any instance runs</text>
    <rect x="322" y="214" width="26" height="20" rx="3" fill="#334155"/>
    <path d="M327 214 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="335" cy="223" r="2.4" fill="#ffffff"/>
  </g>

  <g>
    <rect x="628" y="196" width="380" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="body" x="648" y="219">Instance 1 — replays the fixed binding</text>
    <rect x="628" y="238" width="380" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="body" x="648" y="261">Instance 2 — replays the fixed binding</text>
    <rect x="628" y="280" width="380" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="body" x="648" y="303">Instance 3 — replays the fixed binding</text>
    <text class="small" x="628" y="336">No open questions at execution</text>
  </g>

  <path d="M370 268 C 500 268, 520 250, 620 252" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue-arrow)"/>

  <!-- Lane B: Agentic -->
  <text class="lane" x="70" y="428" fill="#c2410c">AGENTIC AI</text>

  <g>
    <rect x="70" y="444" width="300" height="158" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
    <text class="node-title" x="88" y="478">Task goal only</text>
    <line x1="88" y1="492" x2="352" y2="492" stroke="#fed7aa" stroke-width="2"/>
    <text class="body" x="88" y="524">Says what to attempt —</text>
    <text class="body" x="88" y="552">not what it changes</text>
    <text class="small" x="88" y="584">Binding unresolved at design time</text>
  </g>

  <g>
    <rect x="392" y="446" width="196" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="tag" x="404" y="469">which object?</text>
    <rect x="392" y="488" width="196" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="tag" x="404" y="511">who owns it?</text>
    <rect x="392" y="530" width="196" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="tag" x="404" y="553">which transition is valid?</text>
    <rect x="392" y="572" width="196" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="tag" x="404" y="595">what evidence survives?</text>
  </g>

  <path d="M370 520 C 470 520, 540 522, 646 524" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orange-arrow)"/>

  <g>
    <circle cx="695" cy="524" r="46" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text class="body" x="695" y="520" text-anchor="middle" font-weight="700">AI agent</text>
    <text class="small" x="695" y="540" text-anchor="middle" fill="#9a3412">proposes</text>
    <text class="small" x="695" y="596" text-anchor="middle">resolves the binding per case</text>
  </g>

  <g>
    <rect x="812" y="446" width="330" height="182" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text class="node-title" x="832" y="480">Domain model</text>
    <text class="small" x="832" y="502" fill="#047857">enforced at execution</text>
    <line x1="832" y1="514" x2="1122" y2="514" stroke="#99f6e4" stroke-width="2"/>
    <text class="body" x="832" y="546">· object ownership</text>
    <text class="body" x="832" y="576">· valid transitions</text>
    <text class="body" x="832" y="606">· evidence obligations</text>
  </g>

  <path d="M741 502 H808" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <path d="M812 556 H745" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#teal-arrow)"/>
  <text class="small" x="775" y="494" text-anchor="middle" fill="#9a3412">action</text>
  <text class="small" x="775" y="574" text-anchor="middle" fill="#047857">validates</text>

  <path d="M590 500 C 660 468, 742 452, 808 460" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
  <text class="small" x="702" y="446" text-anchor="middle" fill="#047857">answered here, at runtime</text>

  <text class="caption" x="600" y="668" text-anchor="middle">The relationship the modeler once settled on a diagram now has to hold at the moment of action.</text>
</svg>
