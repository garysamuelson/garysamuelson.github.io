<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1200"
   height="630"
   viewBox="0 0 1200 630"
   font-family="Calibri, Segoe UI, Arial, sans-serif"
   version="1.1"
   id="svg30"
   sodipodi:docname="report_card_blind_spot.svg"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview30"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.3188103"
     inkscape:cx="630.87164"
     inkscape:cy="317.7106"
     inkscape:window-width="1809"
     inkscape:window-height="1364"
     inkscape:window-x="-9"
     inkscape:window-y="-10"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg30" />
  <defs
     id="defs3">
    <marker
       id="arrowGold"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#ffd98a"
         id="path1" />
    </marker>
    <marker
       id="arrowMuted"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M0,0 L10,5 L0,10 z"
         fill="#8fa6b8"
         id="path2" />
    </marker>
    <radialGradient
       id="scanGlow"
       cx="0.5"
       cy="0.5"
       r="0.5">
      <stop
         offset="0"
         stop-color="#ffd98a"
         stop-opacity="0.55"
         id="stop2" />
      <stop
         offset="1"
         stop-color="#ffd98a"
         stop-opacity="0"
         id="stop3" />
    </radialGradient>
    <style
       id="style3">
      .title { font-size: 36px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
      .subtitle { font-size: 18px; fill: #b9d4e6; }
      .panel-label-cool { font-size: 21px; font-weight: 700; fill: #bfe3ff; }
      .panel-label-warm { font-size: 21px; font-weight: 700; fill: #ffd98a; }
      .panel-sub { font-size: 14.5px; fill: #8fa6b8; font-style: italic; }
      .caption { font-size: 15.5px; fill: #cfdce8; }
      .caption-warm { font-size: 15.5px; fill: #ffe3ad; }
      .badge-closed { font-size: 12px; font-weight: 700; fill: #0b1d2b; }
      .badge-open { font-size: 12px; font-weight: 700; fill: #ffd98a; }
      .tiny { font-size: 12.5px; fill: #aebfce; }
      .tiny-gold { font-size: 12.5px; font-weight: 700; fill: #ffd98a; }
      .band-label { font-size: 19px; font-weight: 700; fill: #eaf2f8; }
      .band-sub { font-size: 14px; fill: #9fb3c4; }
      .kpi-number { font-size: 27px; font-weight: 700; fill: #eaf2f8; }
      .kpi-good { font-size: 13.5px; font-weight: 600; fill: #4fd1a5; }
    </style>
  </defs>
  <!-- Background -->
  <rect
     width="1200"
     height="630"
     fill="#0b1d2b"
     id="rect3" />
  <!-- Titles -->
  <text
     x="600"
     y="46"
     text-anchor="middle"
     class="title"
     id="text3">The Report Card's Blind Spot</text>
  <text
     x="600"
     y="74"
     text-anchor="middle"
     class="subtitle"
     id="text4">Every tile read green. The number that mattered wasn't on the board.</text>
  <!-- ============ DASHBOARD PANEL (report card) ============ -->
  <rect
     x="90"
     y="96"
     width="1020"
     height="186"
     rx="14"
     fill="#10202e"
     opacity="0.55"
     stroke="#24384a"
     stroke-width="1.5"
     id="rect4" />
  <text
     x="118"
     y="126"
     class="panel-label-cool"
     id="text5">OPS DASHBOARD — WEEKLY REVIEW</text>
  <rect
     x="972"
     y="106"
     width="118"
     height="24"
     rx="12"
     fill="#ffd98a"
     id="rect5" />
  <text
     x="1031"
     y="122"
     text-anchor="middle"
     class="badge-closed"
     id="text6">CONFIRMATORY</text>
  <!-- Tile 1: Volume -->
  <rect
     x="118"
     y="142"
     width="300"
     height="118"
     rx="10"
     fill="#17293a"
     stroke="#2c4a63"
     stroke-width="1.2"
     id="rect6" />
  <text
     x="140"
     y="172"
     class="tiny-gold"
     id="text7">VOLUME</text>
  <text
     x="140"
     y="208"
     class="kpi-number"
     id="text8">1,204 claims</text>
  <text
     x="140"
     y="234"
     class="kpi-good"
     id="text9">✓ on target</text>
  <!-- Tile 2: Cycle Time -->
  <rect
     x="448"
     y="142"
     width="300"
     height="118"
     rx="10"
     fill="#17293a"
     stroke="#2c4a63"
     stroke-width="1.2"
     id="rect9" />
  <text
     x="470"
     y="172"
     class="tiny-gold"
     id="text10">CYCLE TIME</text>
  <text
     x="470"
     y="208"
     class="kpi-number"
     id="text11">4.2 days</text>
  <text
     x="470"
     y="234"
     class="kpi-good"
     id="text12">✓ within SLA</text>
  <!-- Tile 3: SLA Compliance -->
  <rect
     x="778"
     y="142"
     width="300"
     height="118"
     rx="10"
     fill="#17293a"
     stroke="#2c4a63"
     stroke-width="1.2"
     id="rect12" />
  <text
     x="800"
     y="172"
     class="tiny-gold"
     id="text13">SLA COMPLIANCE</text>
  <text
     x="800"
     y="208"
     class="kpi-number"
     id="text14">98%</text>
  <text
     x="800"
     y="234"
     class="kpi-good"
     id="text15">✓ on target</text>
  <text
     x="600"
     y="282"
     text-anchor="middle"
     class="caption-warm"
     id="text16">REPORT CARD — grades what someone already thought to define</text>
  <!-- Connector down to the hidden signal -->
  <path
     d="M200,282 L 200,310"
     fill="none"
     stroke="#5c6871"
     stroke-width="1.4"
     stroke-dasharray="2,4"
     marker-end="url(#arrowMuted)"
     id="path16" />
  <text
     x="218"
     y="300"
     class="tiny"
     id="text17">meanwhile, quietly, for three weeks</text>
  <!-- ============ HIDDEN SIGNAL PANEL (vehicle-valuation feed) ============ -->
  <rect
     x="90"
     y="314"
     width="650"
     height="210"
     rx="14"
     fill="#10202e"
     opacity="0.45"
     stroke="#8a6d2f"
     stroke-width="1.5"
     stroke-dasharray="5,4"
     id="rect17" />
  <rect
     x="592"
     y="324"
     width="118"
     height="24"
     rx="12"
     fill="none"
     stroke="#ffd98a"
     stroke-width="1.4"
     id="rect18" />
  <text
     x="651"
     y="340"
     text-anchor="middle"
     class="badge-open"
     id="text18">UNTRACKED</text>
  <text
     x="118"
     y="352"
     class="panel-label-warm"
     id="text19">VEHICLE-VALUATION FEED</text>
  <text
     x="118"
     y="372"
     class="panel-sub"
     id="text20">no tile was ever built to see this</text>
  <!-- axis -->
  <path
     d="M118,462 H 690"
     stroke="#3a4c5c"
     stroke-width="1.2"
     id="path20" />
  <!-- feed line: normal, then stale/flat and wrong -->
  <polyline
     points="118,432 220,430 300,428"
     fill="none"
     stroke="#8fa6b8"
     stroke-width="2"
     id="polyline20" />
  <polyline
     points="300,428 340,394 690,392"
     fill="none"
     stroke="#ffd98a"
     stroke-width="2"
     stroke-dasharray="3,4"
     id="polyline21" />
  <circle
     cx="340"
     cy="394"
     r="22"
     fill="url(#scanGlow)"
     id="circle21" />
  <circle
     cx="340"
     cy="394"
     r="4"
     fill="#ffd98a"
     id="circle22" />
  <text
     x="340"
     y="380"
     text-anchor="middle"
     class="tiny-gold"
     id="text22">?</text>
  <text
     x="150"
     y="480"
     text-anchor="middle"
     class="tiny"
     id="text23">Week 1</text>
  <text
     x="330"
     y="480"
     text-anchor="middle"
     class="tiny"
     id="text24">Week 2</text>
  <text
     x="560"
     y="480"
     text-anchor="middle"
     class="tiny-gold"
     id="text25">Week 3 — drift begins</text>
  <text
     x="415"
     y="504"
     text-anchor="middle"
     class="caption"
     id="text26">The regional used-car market spiked. The feed kept answering as if it hadn't.</text>
  <!-- connector to the analyst -->
  <path
     d="M740,394 L 818,394"
     fill="none"
     stroke="#ffd98a"
     stroke-width="1.6"
     stroke-dasharray="2,4"
     marker-end="url(#arrowGold)"
     id="path26" />
  <!-- magnifying glass -->
  <g
     transform="translate(880,374)"
     id="g26">
    <circle
       cx="-6"
       cy="-6"
       r="11"
       fill="none"
       stroke="#ffd98a"
       stroke-width="2.2"
       id="circle26" />
    <line
       x1="2"
       y1="2"
       x2="14"
       y2="14"
       stroke="#ffd98a"
       stroke-width="2.4"
       stroke-linecap="round"
       id="line26" />
  </g>
  <!-- analyst silhouette -->
  <g
     transform="translate(880,434)"
     id="g27">
    <circle
       cx="0"
       cy="-8"
       r="9"
       fill="#cfdce8"
       id="circle27" />
    <path
       d="m -15,20 c 0,-22 30,-22 30,0 z"
       fill="#cfdce8"
       id="path27" />
  </g>
  <text
     x="880"
     y="474"
     text-anchor="middle"
     class="caption-warm"
     id="text27">Found by instinct — not by the board.</text>
  <text
     x="880"
     y="494"
     text-anchor="middle"
     class="tiny"
     id="text28">queue-honed judgment, not a metric</text>
  <!-- ============ BOTTOM BAND ============ -->
  <line
     x1="90"
     y1="540"
     x2="1110"
     y2="540"
     stroke="#24384a"
     stroke-width="1"
     id="line28" />
  <text
     x="600"
     y="574"
     text-anchor="middle"
     class="band-label"
     id="text29">Tracking activity is not the same as surfacing a finding.</text>
  <text
     x="600"
     y="600"
     text-anchor="middle"
     class="band-sub"
     id="text30">A report card confirms. It does not discover.</text>
</svg>
