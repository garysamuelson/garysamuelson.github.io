<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary application interaction</title>
  <desc id="desc">A customer request enters an application that calls rules, domain services, and business data before returning an immediate response.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D9E2E7" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#26343B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17313B" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#F7FAF9"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="72" y="76" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#E64A19">INTERACTION ARCHITECTURE</text>
  <text x="72" y="122" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#17242A">The application coordinates an immediate response</text>
  <text x="72" y="157" font-family="Segoe UI, sans-serif" font-size="18" fill="#52636B">Services execute. Data changes. The interaction ends.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="270" width="220" height="104" rx="8" fill="#FFFFFF" stroke="#93A4AB" stroke-width="2"/>
    <path d="M94 289H119L132 302V344H94Z" fill="#EAF6F4" stroke="#0B7A75" stroke-width="3" stroke-linejoin="round"/>
    <path d="M119 289V302H132" fill="none" stroke="#0B7A75" stroke-width="3" stroke-linejoin="round"/>
    <path d="M102 315H124M102 325H124M102 335H117" fill="none" stroke="#0B7A75" stroke-width="2" stroke-linecap="round"/>
    <text x="151" y="309" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#17242A">Customer request</text>
    <text x="151" y="337" font-family="Segoe UI, sans-serif" font-size="15" fill="#52636B">submitted</text>

    <rect x="385" y="238" width="250" height="168" rx="8" fill="#17242A"/>
    <rect x="385" y="238" width="10" height="168" rx="5" fill="#FC5D0D"/>
    <text x="435" y="288" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#FFB28C">APPLICATION</text>
    <text x="435" y="326" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Request handler</text>
    <text x="435" y="359" font-family="Segoe UI, sans-serif" font-size="16" fill="#C9D4D8">validate · invoke · persist</text>

    <rect x="790" y="204" width="194" height="76" rx="8" fill="#FFFFFF" stroke="#F07B43" stroke-width="2"/>
    <text x="822" y="250" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#17242A">Business rules</text>
    <rect x="790" y="300" width="194" height="76" rx="8" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2"/>
    <text x="816" y="346" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#17242A">Domain services</text>
    <rect x="790" y="396" width="194" height="76" rx="8" fill="#FFFFFF" stroke="#687982" stroke-width="2"/>
    <text x="821" y="442" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#17242A">Business data</text>
  </g>

  <g fill="none" stroke="#26343B" stroke-width="3" marker-end="url(#arrow)">
    <path d="M292 322H385"/>
    <path d="M635 286C704 286 720 242 790 242"/>
    <path d="M635 322H790"/>
    <path d="M635 358C704 358 720 434 790 434"/>
  </g>
  <path d="M385 382C326 442 214 455 151 389" fill="none" stroke="#E64A19" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="404" y="514" width="392" height="76" rx="8" fill="#FFF1E9" stroke="#FC5D0D"/>
  <text x="600" y="545" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#9C3210">IMMEDIATE RESPONSE</text>
  <text x="600" y="571" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#71402F">No durable business obligation remains</text>
</svg>