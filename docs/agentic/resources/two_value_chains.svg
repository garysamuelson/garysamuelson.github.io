<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1200"
   height="630"
   viewBox="0 0 1200 630"
   font-family="Calibri, Segoe UI, Arial, sans-serif"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowCool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bfe3ff" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd98a" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa6b8" />
    </marker>
    <style>
      .title { font-size: 36px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
      .subtitle { font-size: 18px; fill: #b9d4e6; }
      .panel-label-cool { font-size: 21px; font-weight: 700; fill: #bfe3ff; }
      .panel-label-warm { font-size: 21px; font-weight: 700; fill: #ffd98a; }
      .node-text { font-size: 14.5px; font-weight: 600; fill: #eaf2f8; }
      .tiny { font-size: 12.5px; fill: #aebfce; }
      .tiny-gold { font-size: 12.5px; font-weight: 700; fill: #ffd98a; }
      .band-label { font-size: 19px; font-weight: 700; fill: #eaf2f8; }
      .band-sub { font-size: 14px; fill: #9fb3c4; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1d2b" />
  <!-- Titles -->
  <text x="600" y="46" text-anchor="middle" class="title">Two Value Chains, One Insurer</text>
  <text x="600" y="74" text-anchor="middle" class="subtitle">The primary chain settles the claim. The Reflexive Value Chain keeps it honest.</text>

  <!-- ============ PRIMARY VALUE CHAIN ============ -->
  <rect x="90" y="100" width="1020" height="170" rx="14" fill="#10202e" opacity="0.55" stroke="#24384a" stroke-width="1.5" />
  <text x="118" y="128" class="panel-label-cool">PRIMARY VALUE CHAIN</text>
  <text x="1082" y="128" text-anchor="end" class="tiny">customer: the policyholder</text>

  <rect x="118" y="150" width="210" height="70" rx="10" fill="#17293a" stroke="#2c4a63" stroke-width="1.2" />
  <text x="223" y="180" text-anchor="middle" class="node-text"><tspan x="223" dy="0">Loss</tspan><tspan x="223" dy="18">Reported</tspan></text>

  <rect x="369" y="150" width="210" height="70" rx="10" fill="#17293a" stroke="#2c4a63" stroke-width="1.2" />
  <text x="474" y="180" text-anchor="middle" class="node-text"><tspan x="474" dy="0">Resources &amp;</tspan><tspan x="474" dy="18">Judgment Act</tspan></text>

  <rect x="620" y="150" width="210" height="70" rx="10" fill="#17293a" stroke="#2c4a63" stroke-width="1.2" />
  <text x="725" y="180" text-anchor="middle" class="node-text"><tspan x="725" dy="0">Settlement</tspan><tspan x="725" dy="18">Reached</tspan></text>

  <rect x="871" y="150" width="210" height="70" rx="10" fill="#17293a" stroke="#2c4a63" stroke-width="1.2" />
  <text x="976" y="180" text-anchor="middle" class="node-text"><tspan x="976" dy="0">Claim</tspan><tspan x="976" dy="18">Paid</tspan></text>

  <path d="M328,185 L 365,185" fill="none" stroke="#bfe3ff" stroke-width="1.8" marker-end="url(#arrowCool)" />
  <path d="M579,185 L 616,185" fill="none" stroke="#bfe3ff" stroke-width="1.8" marker-end="url(#arrowCool)" />
  <path d="M830,185 L 867,185" fill="none" stroke="#bfe3ff" stroke-width="1.8" marker-end="url(#arrowCool)" />

  <!-- ============ REFLEXIVE VALUE CHAIN ============ -->
  <rect x="90" y="300" width="1020" height="170" rx="14" fill="#10202e" opacity="0.55" stroke="#6b5530" stroke-width="1.5" />
  <text x="118" y="328" class="panel-label-warm">REFLEXIVE VALUE CHAIN</text>
  <text x="1082" y="328" text-anchor="end" class="tiny">customer: the primary chain itself</text>

  <rect x="118" y="350" width="210" height="70" rx="10" fill="#17293a" stroke="#6b5530" stroke-width="1.2" />
  <text x="223" y="380" text-anchor="middle" class="node-text"><tspan x="223" dy="0">Watches</tspan><tspan x="223" dy="18">Every Case</tspan></text>

  <rect x="369" y="350" width="210" height="70" rx="10" fill="#17293a" stroke="#6b5530" stroke-width="1.2" />
  <text x="474" y="380" text-anchor="middle" class="node-text"><tspan x="474" dy="0">Diagnoses</tspan><tspan x="474" dy="18">Drift</tspan></text>

  <rect x="620" y="350" width="210" height="70" rx="10" fill="#17293a" stroke="#6b5530" stroke-width="1.2" />
  <text x="725" y="380" text-anchor="middle" class="node-text"><tspan x="725" dy="0">Surfaces a</tspan><tspan x="725" dy="18">Finding</tspan></text>

  <rect x="871" y="350" width="210" height="70" rx="10" fill="#17293a" stroke="#6b5530" stroke-width="1.2" />
  <text x="976" y="380" text-anchor="middle" class="node-text"><tspan x="976" dy="0">Analyst</tspan><tspan x="976" dy="18">Decides</tspan></text>

  <path d="M328,385 L 365,385" fill="none" stroke="#ffd98a" stroke-width="1.8" marker-end="url(#arrowGold)" />
  <path d="M579,385 L 616,385" fill="none" stroke="#ffd98a" stroke-width="1.8" marker-end="url(#arrowGold)" />
  <path d="M830,385 L 867,385" fill="none" stroke="#ffd98a" stroke-width="1.8" marker-end="url(#arrowGold)" />

  <text x="600" y="450" text-anchor="middle" class="tiny-gold">Payment: avoided reopened claims, avoided complaints, preserved trust</text>

  <!-- ============ CROSS-LANE CONNECTORS (message flows) ============ -->
  <circle cx="223" cy="300" r="3.5" fill="#0b1d2b" stroke="#8fa6b8" stroke-width="1.4" />
  <path d="M223,300 L 223,270" fill="none" stroke="#8fa6b8" stroke-width="1.4" stroke-dasharray="2,4" marker-end="url(#arrowMuted)" />

  <circle cx="474" cy="300" r="3.5" fill="#0b1d2b" stroke="#8fa6b8" stroke-width="1.4" />
  <path d="M474,300 L 474,270" fill="none" stroke="#8fa6b8" stroke-width="1.4" stroke-dasharray="2,4" marker-end="url(#arrowMuted)" />

  <circle cx="976" cy="300" r="3.5" fill="#0b1d2b" stroke="#8fa6b8" stroke-width="1.4" />
  <path d="M976,300 L 976,270" fill="none" stroke="#8fa6b8" stroke-width="1.4" stroke-dasharray="2,4" marker-end="url(#arrowMuted)" />

  <text x="245" y="290" class="tiny">watches every stage, every case</text>

  <!-- the specific finding from the scenario, feeding back into Settlement -->
  <circle cx="725" cy="300" r="4" fill="#0b1d2b" stroke="#ffd98a" stroke-width="1.8" />
  <path d="M725,300 L 725,270" fill="none" stroke="#ffd98a" stroke-width="2" stroke-dasharray="2,4" marker-end="url(#arrowGold)" />
  <text x="742" y="288" class="tiny-gold">finding: valuation feed may be stale</text>

  <!-- ============ BOTTOM BAND ============ -->
  <line x1="90" y1="490" x2="1110" y2="490" stroke="#24384a" stroke-width="1" />
  <text x="600" y="524" text-anchor="middle" class="band-label">One chain is paid in premium revenue the policyholder already trusted it with.</text>
  <text x="600" y="550" text-anchor="middle" class="band-sub">The other is paid in reopened claims that never happen. Porter named the category — this is what its output looks like when the primary chain is a saga, not a factory line.</text>
</svg>
