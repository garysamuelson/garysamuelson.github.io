<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490">

  <!-- Background -->
  <rect width="1000" height="490" fill="#f6f4ef"/>

  <!-- TITLE -->
  <text x="500" y="27" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Work in Motion — From Raw Activity to Customer Value</text>
  <text x="500" y="45" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#6a6a7a" text-anchor="middle">Each station applies effort (tasks · workers) that transforms the work object — adding state, advancing value</text>

  <!--
    y-scale: 100 units = 280px (2.8px/unit)  top-aligned at y=62
    Input:    280px  y=62–342   (100%)
    S1 main: 238px  y=62–300   (85%)   S1 exit 42px y=300–342
    S2 main: 196px  y=62–258   (70%)   S2 exit 42px y=258–300
    S3 main: 154px  y=62–216   (55%)   S3 exit 42px y=216–258
    Output:  154px  y=62–216

    x layout:
    Input: 30–110  | Band1: 110–230 | S1: 230–310 | Band2: 310–430
    S2: 430–510    | Band3: 510–630 | S3: 630–710 | Band4: 710–830
    Output: 830–910
  -->

  <!-- COLUMN HEADERS -->
  <text x="70" y="57" font-family="Calibri,Arial,sans-serif" font-size="8" font-weight="bold" fill="#8a8a9a" text-anchor="middle" letter-spacing="0.5">INPUT</text>
  <text x="270" y="57" font-family="Calibri,Arial,sans-serif" font-size="8" font-weight="bold" fill="#2b5080" text-anchor="middle" letter-spacing="0.5">STAGE 1</text>
  <text x="470" y="57" font-family="Calibri,Arial,sans-serif" font-size="8" font-weight="bold" fill="#1a3d70" text-anchor="middle" letter-spacing="0.5">STAGE 2</text>
  <text x="670" y="57" font-family="Calibri,Arial,sans-serif" font-size="8" font-weight="bold" fill="#4a3575" text-anchor="middle" letter-spacing="0.5">STAGE 3</text>
  <text x="870" y="57" font-family="Calibri,Arial,sans-serif" font-size="8" font-weight="bold" fill="#1e6040" text-anchor="middle" letter-spacing="0.5">OUTPUT</text>

  <!-- ================================ -->
  <!-- CONNECTING BANDS                 -->
  <!-- ================================ -->

  <!-- Band 1: Input → S1  (100%, y=62–342) -->
  <rect x="110" y="62" width="120" height="280" fill="#5a5868" opacity="0.18"/>
  <text x="170" y="206" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#4a4858" text-anchor="middle">100%</text>
  <text x="170" y="219" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#6a6a7a" text-anchor="middle">enters</text>

  <!-- Band 2: S1 → S2  (85%, y=62–300) -->
  <rect x="310" y="62" width="120" height="238" fill="#2b5080" opacity="0.18"/>
  <text x="370" y="183" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2b5080" text-anchor="middle">85%</text>
  <text x="370" y="196" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#3a6090" text-anchor="middle">advances</text>

  <!-- Band 3: S2 → S3  (70%, y=62–258) -->
  <rect x="510" y="62" width="120" height="196" fill="#1a3d70" opacity="0.18"/>
  <text x="570" y="161" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a3d70" text-anchor="middle">70%</text>
  <text x="570" y="174" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a4d80" text-anchor="middle">advances</text>

  <!-- Band 4: S3 → Output  (55%, y=62–216) -->
  <rect x="710" y="62" width="120" height="154" fill="#1e6040" opacity="0.18"/>
  <text x="770" y="141" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e6040" text-anchor="middle">55%</text>
  <text x="770" y="154" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2d6a4f" text-anchor="middle">completes</text>

  <!-- ================================ -->
  <!-- INPUT NODE  x=30–110  y=62–342  -->
  <!-- ================================ -->
  <!-- Submissions 40% (112px): y=62–174 -->
  <rect x="30" y="62" width="80" height="112" fill="#4a4858" rx="4"/>
  <text x="70" y="100" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">New</text>
  <text x="70" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#d0ced8" text-anchor="middle">Submissions</text>
  <text x="70" y="126" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#b0b0bc" text-anchor="middle">40%</text>

  <!-- Claims 35% (98px): y=176–274 -->
  <rect x="30" y="176" width="80" height="98" fill="#3c3a4a" rx="4"/>
  <text x="70" y="218" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Claims</text>
  <text x="70" y="232" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#b0b0bc" text-anchor="middle">35%</text>

  <!-- Applications 25% (68px): y=276–342 (2px gap) -->
  <rect x="30" y="276" width="80" height="66" fill="#2e2c3a" rx="4"/>
  <text x="70" y="305" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Loan</text>
  <text x="70" y="317" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#b0b0bc" text-anchor="middle">Applications</text>
  <text x="70" y="331" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9a9aaa" text-anchor="middle">25%</text>

  <!-- Input footer label -->
  <text x="70" y="358" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#4a4858" text-anchor="middle">Work Arrives</text>
  <text x="70" y="370" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a8a9a" text-anchor="middle">undifferentiated</text>

  <!-- ================================ -->
  <!-- STAGE 1  x=230–310  y=62–342    -->
  <!-- Main: y=62–300 (238px)           -->
  <!-- Exit: y=300–342 (42px)           -->
  <!-- ================================ -->
  <rect x="230" y="62" width="80" height="238" fill="#2b5080" rx="4"/>
  <text x="270" y="110" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Receipt &amp;</text>
  <text x="270" y="123" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Validation</text>
  <line x1="234" y1="136" x2="306" y2="136" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="270" y="150" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Task: Intake review</text>
  <text x="270" y="163" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Worker: Intake agent</text>
  <line x1="234" y1="176" x2="306" y2="176" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="270" y="191" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#bfdbfe" text-anchor="middle">State added:</text>
  <text x="270" y="204" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Received · Logged · Staged</text>
  <text x="270" y="218" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7ab8f0" text-anchor="middle">Work Record instantiated</text>

  <!-- S1 exit band -->
  <rect x="230" y="300" width="80" height="42" fill="#8b5e00" rx="0"/>
  <rect x="230" y="298" width="80" height="4" fill="#2b5080"/>
  <text x="270" y="317" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fff5d4" text-anchor="middle">15% returned</text>
  <text x="270" y="329" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fde68a" text-anchor="middle">for more info</text>

  <!-- S1 exit downward arrow -->
  <line x1="270" y1="342" x2="270" y2="373" stroke="#8b5e00" stroke-width="1.5"/>
  <polygon points="263,370 277,370 270,382" fill="#8b5e00"/>
  <text x="270" y="392" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8b5e00" text-anchor="middle">Closed at Stage 1</text>

  <!-- ================================ -->
  <!-- STAGE 2  x=430–510  y=62–300    -->
  <!-- Main: y=62–258 (196px)           -->
  <!-- Exit: y=258–300 (42px)           -->
  <!-- ================================ -->
  <rect x="430" y="62" width="80" height="196" fill="#1a3d70" rx="4"/>
  <text x="470" y="105" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assessment</text>
  <text x="470" y="118" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">&amp; Review</text>
  <line x1="434" y1="130" x2="506" y2="130" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="470" y="144" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Task: Risk analysis</text>
  <text x="470" y="157" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Worker: UW + AI agent</text>
  <line x1="434" y1="170" x2="506" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="470" y="184" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#bfdbfe" text-anchor="middle">State added:</text>
  <text x="470" y="197" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Risk score · Coverage position</text>
  <text x="470" y="210" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7ab8f0" text-anchor="middle">Decision rationale logged</text>

  <!-- S2 exit band -->
  <rect x="430" y="258" width="80" height="42" fill="#8b5e00" rx="0"/>
  <rect x="430" y="256" width="80" height="4" fill="#1a3d70"/>
  <text x="470" y="275" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fff5d4" text-anchor="middle">15% escalated</text>
  <text x="470" y="287" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fde68a" text-anchor="middle">specialist review</text>

  <line x1="470" y1="300" x2="470" y2="373" stroke="#8b5e00" stroke-width="1.5"/>
  <polygon points="463,370 477,370 470,382" fill="#8b5e00"/>
  <text x="470" y="392" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8b5e00" text-anchor="middle">Closed at Stage 2</text>

  <!-- ================================ -->
  <!-- STAGE 3  x=630–710  y=62–258    -->
  <!-- Main: y=62–216 (154px)           -->
  <!-- Exit: y=216–258 (42px)           -->
  <!-- ================================ -->
  <rect x="630" y="62" width="80" height="154" fill="#4a3575" rx="4"/>
  <text x="670" y="103" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Decision &amp;</text>
  <text x="670" y="116" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Commitment</text>
  <line x1="634" y1="128" x2="706" y2="128" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="670" y="142" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Task: Authority gate</text>
  <text x="670" y="155" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Worker: Sr. UW + DMN</text>
  <line x1="634" y1="166" x2="706" y2="166" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="670" y="180" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#ddd6fe" text-anchor="middle">State added:</text>
  <text x="670" y="193" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Authority · Terms · Bound</text>

  <!-- S3 exit band -->
  <rect x="630" y="216" width="80" height="42" fill="#8b1a2c" rx="0"/>
  <rect x="630" y="214" width="80" height="4" fill="#4a3575"/>
  <text x="670" y="233" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fecaca" text-anchor="middle">15% declined</text>
  <text x="670" y="245" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#fca5a5" text-anchor="middle">formally closed</text>

  <line x1="670" y1="258" x2="670" y2="373" stroke="#8b1a2c" stroke-width="1.5"/>
  <polygon points="663,370 677,370 670,382" fill="#8b1a2c"/>
  <text x="670" y="392" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8b1a2c" text-anchor="middle">Closed at Stage 3</text>

  <!-- ================================ -->
  <!-- OUTPUT NODE  x=830–910  y=62–216 -->
  <!-- 55% = 154px                      -->
  <!-- ================================ -->
  <rect x="830" y="62" width="80" height="154" fill="#1e6040" rx="4"/>
  <text x="870" y="103" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Customer</text>
  <text x="870" y="116" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Value</text>
  <line x1="834" y1="128" x2="906" y2="128" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="870" y="142" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#bbf7d0" text-anchor="middle">Policy bound</text>
  <text x="870" y="155" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#86efac" text-anchor="middle">Claim settled</text>
  <text x="870" y="168" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#86efac" text-anchor="middle">Loan funded</text>
  <text x="870" y="186" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#4ade80" text-anchor="middle">Value → Exchange</text>
  <text x="870" y="200" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#6ee7b7" text-anchor="middle">Payment proves value</text>

  <!-- Output footer label -->
  <text x="870" y="232" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#1e6040" text-anchor="middle">55% complete</text>
  <text x="870" y="244" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#5a9a7a" text-anchor="middle">all with full event log</text>

  <!-- ================================ -->
  <!-- FOOTER                           -->
  <!-- ================================ -->
  <rect x="0" y="404" width="1000" height="86" fill="#e8e6de"/>
  <line x1="0" y1="405" x2="1000" y2="405" stroke="#c4c0b8" stroke-width="1"/>
  <text x="500" y="424" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Every exit is a completion — not a failure. Work closes where the domain closes it.</text>
  <text x="500" y="442" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a4858" text-anchor="middle">The Work Record makes each decision possible: it carries the state that tells each station what arrived, what happened before, and what is valid next.</text>
  <text x="500" y="460" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#6a6a7a" text-anchor="middle">Without it, every piece of work looks identical to every agent. Stage, history, and accountability collapse into a document with a question attached.</text>
  <text x="500" y="479" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">© 2026 Gary Samuelson · Work Record Series · CC BY-NC-ND 4.0</text>

</svg>
