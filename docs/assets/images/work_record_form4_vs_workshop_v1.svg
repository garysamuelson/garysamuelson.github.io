     fill="#1a1a2e"
     text-anchor="middle"
     id="text45">Form Four does not ask what you believe you do. It reads what you actually did.</text>
  <text
     x="500"
     y="465"
     font-family="Calibri,Arial,sans-serif"
     font-size="10"
     fill="#4a4858"
     text-anchor="middle"
     id="text46">The domain model emerges from what already ran — and flows back to the organization as a structured Work Record class.</text>
