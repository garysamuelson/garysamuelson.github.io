<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <marker id="fp-arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4a4858"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="440" fill="#f6f4ef"/>

  <!-- TITLE -->
  <text x="500" y="27" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a1a2e" text-anchor="middle">From Stateless to Context-Aware: The Form Four Recovery Path</text>
  <text x="500" y="46" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#6a6a7a" text-anchor="middle">ProcessOS discovers the domain that was never modeled · builds the Work Record class · connects agents to reality</text>

  <!-- ================================================ -->
  <!-- STAGE 1: STATELESS AGENTS (Problem State)        -->
  <!-- x=20, w=205                                      -->
  <!-- ================================================ -->
  <rect x="20" y="58" width="205" height="262" fill="#fef8f8" rx="6" stroke="#8b1a2c" stroke-width="1.5"/>
  <rect x="20" y="58" width="205" height="32" fill="#8b1a2c" rx="6"/>
  <rect x="20" y="72" width="205" height="18" fill="#8b1a2c"/>
  <text x="122" y="75" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Stateless Agents</text>
  <text x="122" y="88" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">Phase 0 — Problem State</text>

  <text x="34" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">▸  Wired to document only</text>
  <text x="34" y="128" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">▸  No process instance to query</text>
  <text x="34" y="144" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">▸  Every submission looks the same</text>
  <text x="34" y="160" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">▸  Outputs float — no address</text>
  <text x="34" y="176" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">▸  Pilot works · Production breaks</text>

  <line x1="34" y1="190" x2="210" y2="190" stroke="#e8d0d0" stroke-width="1"/>

  <text x="34" y="206" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" font-weight="bold">Domain: not modeled</text>
  <text x="34" y="222" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9a6a6a">Work Record: does not exist</text>
  <text x="34" y="238" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9a6a6a">Event log: incomplete / siloed</text>

  <rect x="34" y="286" width="177" height="22" fill="#fbeaed" rx="3"/>
  <text x="122" y="301" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" text-anchor="middle">89% don't reach production  [Freund 2026]</text>

  <!-- Stage label below -->
  <text x="122" y="336" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">Before</text>

  <!-- ================================================ -->
  <!-- ARROW 1→2                                        -->
  <!-- ================================================ -->
  <line x1="232" y1="189" x2="268" y2="189" stroke="#4a4858" stroke-width="2" marker-end="url(#fp-arr)"/>

  <!-- ================================================ -->
  <!-- STAGE 2: PROCESSOS DISCOVER                     -->
  <!-- x=275, w=205                                     -->
  <!-- ================================================ -->
  <rect x="275" y="58" width="205" height="262" fill="#edf2f9" rx="6" stroke="#2b5080" stroke-width="1.5"/>
  <rect x="275" y="58" width="205" height="32" fill="#2b5080" rx="6"/>
  <rect x="275" y="72" width="205" height="18" fill="#2b5080"/>
  <text x="377" y="75" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ProcessOS: Discover</text>
  <text x="377" y="88" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">Form Four — Event Log Mining</text>

  <text x="289" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Mines existing event log population</text>
  <text x="289" y="128" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Reconstructs actual execution paths</text>
  <text x="289" y="144" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Surfaces the conformance delta:</text>
  <text x="299" y="159" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a6080" font-style="italic">designed vs. what actually ran</text>
  <text x="289" y="176" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Domain emerges from evidence</text>

  <line x1="289" y1="190" x2="465" y2="190" stroke="#c0ccdc" stroke-width="1"/>

  <text x="289" y="206" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2b5080" font-weight="bold">No preconditions required</text>
  <text x="289" y="222" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a">Reads existing execution history</text>
  <text x="289" y="238" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a">Works on legacy or partial data</text>

  <rect x="289" y="286" width="177" height="22" fill="#d8e2ed" rx="3"/>
  <text x="377" y="301" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" text-anchor="middle" font-weight="bold">Form Four: operates on models</text>

  <text x="377" y="336" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">Form Four Discovers</text>

  <!-- ================================================ -->
  <!-- ARROW 2→3                                        -->
  <!-- ================================================ -->
  <line x1="487" y1="189" x2="523" y2="189" stroke="#4a4858" stroke-width="2" marker-end="url(#fp-arr)"/>

  <!-- ================================================ -->
  <!-- STAGE 3: WORK RECORD CLASS                      -->
  <!-- x=530, w=205                                     -->
  <!-- ================================================ -->
  <rect x="530" y="58" width="205" height="262" fill="#e8f0f6" rx="6" stroke="#1a3d70" stroke-width="1.5"/>
  <rect x="530" y="58" width="205" height="32" fill="#1a3d70" rx="6"/>
  <rect x="530" y="72" width="205" height="18" fill="#1a3d70"/>
  <text x="632" y="75" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Work Record Class</text>
  <text x="632" y="88" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">Domain model defined</text>

  <text x="544" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" font-weight="bold">▸  Identity:</text>
  <text x="600" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">this specific instance</text>
  <text x="544" y="128" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" font-weight="bold">▸  State:</text>
  <text x="585" y="128" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">position + full history</text>
  <text x="544" y="144" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" font-weight="bold">▸  Actions:</text>
  <text x="598" y="144" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">valid next moves</text>
  <text x="544" y="160" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" font-weight="bold">▸  Owner:</text>
  <text x="593" y="160" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">accountable party now</text>

  <line x1="544" y1="174" x2="720" y2="174" stroke="#b0c0d4" stroke-width="1"/>

  <text x="544" y="190" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Lifecycle stages mapped</text>
  <text x="544" y="206" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Valid transitions defined</text>
  <text x="544" y="222" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Closing condition specified</text>
  <text x="544" y="238" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a3a5a">▸  Class ready for instantiation</text>

  <rect x="544" y="286" width="177" height="22" fill="#ccdde8" rx="3"/>
  <text x="632" y="301" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a3d70" text-anchor="middle" font-weight="bold">Domain fit established</text>

  <text x="632" y="336" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">Model Emerges</text>

  <!-- ================================================ -->
  <!-- ARROW 3→4                                        -->
  <!-- ================================================ -->
  <line x1="742" y1="189" x2="778" y2="189" stroke="#4a4858" stroke-width="2" marker-end="url(#fp-arr)"/>

  <!-- ================================================ -->
  <!-- STAGE 4: CONTEXT-AWARE AGENTS                   -->
  <!-- x=785, w=195                                     -->
  <!-- ================================================ -->
  <rect x="785" y="58" width="195" height="262" fill="#eaf5ee" rx="6" stroke="#1e6040" stroke-width="1.5"/>
  <rect x="785" y="58" width="195" height="32" fill="#1e6040" rx="6"/>
  <rect x="785" y="72" width="195" height="18" fill="#1e6040"/>
  <text x="882" y="75" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Context-Aware Agents</text>
  <text x="882" y="88" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">Form 1 → 2 → 4 lifecycle</text>

  <text x="799" y="112" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1e4a30">▸  Agent queries live Work Record</text>
  <text x="799" y="128" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1e4a30">▸  Receives: stage · history · actions</text>
  <text x="799" y="144" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1e4a30">▸  Outputs land on process instance</text>
  <text x="799" y="160" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1e4a30">▸  Every decision logged per-instance</text>

  <line x1="799" y1="174" x2="966" y2="174" stroke="#a0d4b4" stroke-width="1"/>

  <text x="799" y="190" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2d5a42">▸  Event log accumulates</text>
  <text x="799" y="206" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2d5a42">▸  Process mining feeds Form Two</text>
  <text x="799" y="222" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2d5a42">▸  Form Four governs the model</text>
  <text x="799" y="238" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2d5a42">▸  Pilot-to-production path opens</text>

  <rect x="799" y="286" width="167" height="22" fill="#c0e8cc" rx="3"/>
  <text x="882" y="301" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1e4a30" text-anchor="middle" font-weight="bold">Stateless Deployment resolved</text>

  <text x="882" y="336" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">Form One Begins</text>

  <!-- ================================================ -->
  <!-- FOOTER                                           -->
  <!-- ================================================ -->
  <rect x="0" y="352" width="1000" height="88" fill="#e8e6de"/>
  <line x1="0" y1="353" x2="1000" y2="353" stroke="#c4c0b8" stroke-width="1"/>
  <text x="500" y="376" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Form Four is the meta-solution: it builds the domain model the deployment phase skipped.</text>
  <text x="500" y="395" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a4858" text-anchor="middle">Once the Work Record class is defined, Forms One, Two, and Three have what they need.</text>
  <text x="500" y="414" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#6a6a7a" text-anchor="middle">The event log that Form Two and Form Four depend on does not exist before Form One runs — this pipeline is not reversible.</text>
  <text x="500" y="432" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">© 2026 Gary Samuelson · Work Record Series · CC BY-NC-ND 4.0</text>

</svg>
