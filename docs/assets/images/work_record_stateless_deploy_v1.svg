<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <marker id="i-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4858"/>
    </marker>
    <marker id="i-arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2b5080"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#f6f4ef"/>

  <!-- Subtle layer tinting -->
  <rect x="0" y="65" width="1000" height="190" fill="#fdfcf8" opacity="0.7"/>
  <rect x="0" y="284" width="1000" height="128" fill="#f0f4fa" opacity="0.6"/>

  <!-- TITLE -->
  <text x="500" y="28" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Stateless Deployment</text>
  <text x="500" y="48" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#6a6a7a" text-anchor="middle">The agent reasons correctly on the artifact · no access to the process instance · the output has nowhere to land</text>

  <!-- ============================ -->
  <!-- ARTIFACT LAYER               -->
  <!-- ============================ -->

  <text x="32" y="73" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#9a9898" letter-spacing="1.5">ARTIFACT LAYER</text>

  <!-- Platform shelf shadow -->
  <rect x="83" y="83" width="836" height="168" fill="#ddd9d3" rx="8" opacity="0.35"/>
  <!-- Platform shelf -->
  <rect x="80" y="80" width="836" height="168" fill="#faf9f6" rx="8" stroke="#c4c0b8" stroke-width="1.5"/>

  <!-- DOCUMENT ICON (x=122, y=98) -->
  <rect x="122" y="98" width="66" height="86" fill="#eeeceb" rx="3" stroke="#4a4858" stroke-width="1.5"/>
  <!-- Folded corner -->
  <polygon points="166,98 188,98 188,120" fill="#c8c5be"/>
  <line x1="166" y1="98" x2="166" y2="120" stroke="#4a4858" stroke-width="1"/>
  <line x1="166" y1="120" x2="188" y2="120" stroke="#4a4858" stroke-width="1"/>
  <!-- Document content lines -->
  <line x1="132" y1="132" x2="160" y2="132" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="132" y1="146" x2="176" y2="146" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="132" y1="160" x2="153" y2="160" stroke="#b0ada8" stroke-width="1.2"/>
  <!-- Document label -->
  <text x="155" y="200" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a4858" text-anchor="middle">Submission</text>
  <text x="155" y="213" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">artifact only</text>

  <!-- Arrow: doc → agent -->
  <line x1="190" y1="141" x2="288" y2="141" stroke="#4a4858" stroke-width="1.5" marker-end="url(#i-arr)"/>

  <!-- AGENT BOX -->
  <rect x="292" y="96" width="190" height="96" fill="#edeaf5" rx="6" stroke="#4a3575" stroke-width="1.5"/>
  <text x="387" y="130" font-family="Calibri,Arial,sans-serif" font-size="13" font-weight="bold" fill="#2a2a38" text-anchor="middle">AI Agent</text>
  <text x="387" y="150" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a3575" text-anchor="middle">Reasons on artifact</text>
  <text x="387" y="167" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa" text-anchor="middle">Returns risk score · correctly</text>

  <!-- Output arrow pointing DOWN: solid then dashes then dissolves at gap -->
  <line x1="387" y1="192" x2="387" y2="226" stroke="#4a3575" stroke-width="2"/>
  <line x1="387" y1="226" x2="387" y2="258" stroke="#8b1a2c" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- X at gap -->
  <text x="387" y="278" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#8b1a2c" text-anchor="middle" font-weight="bold">✕</text>

  <!-- Labels beside downward arrow -->
  <text x="408" y="210" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a3575">recommendation</text>
  <text x="408" y="224" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a3575">tries to reach the</text>
  <text x="408" y="242" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c">process instance below...</text>

  <!-- BLIND SPOT PANEL (right side of platform) -->
  <rect x="528" y="96" width="368" height="136" fill="#fbeaed" rx="5" stroke="#8b1a2c" stroke-width="1"/>
  <text x="712" y="114" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#8b1a2c" text-anchor="middle">Cannot see from here:</text>
  <text x="540" y="131" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">✕  What stage is this submission in?</text>
  <text x="540" y="147" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">✕  New business or third re-submission?</text>
  <text x="540" y="163" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">✕  Prior decline on record?</text>
  <text x="540" y="179" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">✕  Were loss runs received or outstanding?</text>
  <text x="540" y="195" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a2030">✕  Is competitor policy still active?</text>
  <text x="712" y="218" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" font-style="italic" text-anchor="middle">State lives in the process instance below</text>

  <!-- ============================ -->
  <!-- GAP ZONE (y=252-288)        -->
  <!-- ============================ -->

  <line x1="20" y1="284" x2="980" y2="284" stroke="#b0ada8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="500" y="280" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#9a9898" text-anchor="middle">—  —  —  no connection between layers  —  —  —</text>

  <!-- ============================ -->
  <!-- PROCESS INSTANCE LAYER       -->
  <!-- (y=288-412)                  -->
  <!-- ============================ -->

  <text x="32" y="300" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#2b5080" letter-spacing="1.5">PROCESS INSTANCE LAYER  (Work Record — running state)</text>

  <!-- Stage 1 -->
  <rect x="30" y="312" width="158" height="72" fill="#e8edf5" rx="6" stroke="#2b5080" stroke-width="1.5"/>
  <text x="109" y="334" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2b5080" text-anchor="middle">New Submission</text>
  <text x="109" y="351" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a" text-anchor="middle">Stage 1</text>
  <text x="109" y="366" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">log: 2 events</text>
  <text x="109" y="378" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">prior submission on file</text>

  <!-- Arrow 1→2 -->
  <line x1="188" y1="348" x2="232" y2="348" stroke="#2b5080" stroke-width="1.5" marker-end="url(#i-arr-blue)"/>

  <!-- Stage 2 -->
  <rect x="234" y="312" width="158" height="72" fill="#e8edf5" rx="6" stroke="#2b5080" stroke-width="1.5"/>
  <text x="313" y="334" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2b5080" text-anchor="middle">Loss Runs Rec'd</text>
  <text x="313" y="351" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a" text-anchor="middle">Stage 2</text>
  <text x="313" y="366" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">log: 8 events</text>
  <text x="313" y="378" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">received Jun 12</text>

  <!-- Arrow 2→3 -->
  <line x1="392" y1="348" x2="436" y2="348" stroke="#2b5080" stroke-width="1.5" marker-end="url(#i-arr-blue)"/>

  <!-- Stage 3: HIGHLIGHTED — this is where sub #47 actually is -->
  <rect x="438" y="304" width="178" height="88" fill="#d8e2ed" rx="6" stroke="#1a3d70" stroke-width="2"/>
  <text x="527" y="324" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a3d70" text-anchor="middle">Pricing Review</text>
  <text x="527" y="341" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2b5080" text-anchor="middle">Stage 3</text>
  <text x="527" y="356" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#2b5080" text-anchor="middle">log: 14 events · prior decline: yes</text>
  <text x="527" y="371" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8b1a2c" font-weight="bold" text-anchor="middle">◀ submission #47 is here</text>
  <text x="527" y="384" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8b1a2c" text-anchor="middle">agent above cannot see this</text>

  <!-- Arrow 3→4 -->
  <line x1="616" y1="348" x2="660" y2="348" stroke="#2b5080" stroke-width="1.5" marker-end="url(#i-arr-blue)"/>

  <!-- Stage 4 -->
  <rect x="662" y="312" width="158" height="72" fill="#e8edf5" rx="6" stroke="#2b5080" stroke-width="1.5"/>
  <text x="741" y="334" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2b5080" text-anchor="middle">Bound / Declined</text>
  <text x="741" y="351" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a" text-anchor="middle">Stage 4</text>
  <text x="741" y="366" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">outcome recorded</text>
  <text x="741" y="378" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#8a9aaa" text-anchor="middle">value delivered</text>

  <!-- Right annotation -->
  <text x="842" y="332" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a">lifecycle: live</text>
  <text x="842" y="348" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a">state: connected</text>
  <text x="842" y="364" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a">event log: growing</text>
  <text x="842" y="382" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" font-style="italic">unreachable from above</text>

  <!-- ============================ -->
  <!-- FOOTER                       -->
  <!-- ============================ -->
  <rect x="0" y="418" width="1000" height="82" fill="#e8e6de"/>
  <line x1="0" y1="419" x2="1000" y2="419" stroke="#c4c0b8" stroke-width="1"/>
  <text x="500" y="441" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The agent has the artifact. The process instance has the state. Nothing connects them.</text>
  <text x="500" y="459" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a4858" text-anchor="middle">Build the Work Record first · connect the agent to live process state · the recommendation lands where it belongs</text>
  <text x="500" y="479" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">© 2026 Gary Samuelson · Work Record Series · CC BY-NC-ND 4.0</text>

</svg>
