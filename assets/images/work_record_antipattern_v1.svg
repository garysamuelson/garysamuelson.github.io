<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2b5080"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a6a7a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="#f6f4ef"/>

  <!-- TITLE -->
  <text x="500" y="31" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The Submission the Agent Couldn't Read</text>
  <text x="500" y="50" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#6a6a7a" text-anchor="middle">Anti-pattern: AI agent deployed without workflow state · 89% of agent use cases don't reach production [Freund 2026]</text>

  <!-- ============================== -->
  <!-- COL 1: DATA SOURCES (x=18-278) -->
  <!-- ============================== -->

  <text x="148" y="68" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8a8a9a" text-anchor="middle">ENTERPRISE DATA SOURCES</text>

  <!-- PAS BOX -->
  <rect x="18" y="74" width="260" height="185" fill="#e8edf5" rx="5" stroke="#2b5080" stroke-width="1.5"/>
  <rect x="18" y="74" width="260" height="26" fill="#2b5080" rx="5"/>
  <rect x="18" y="88" width="260" height="12" fill="#2b5080"/>
  <text x="148" y="91" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Policy Admin System  (PAS)</text>

  <text x="30" y="116" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Stage:</text>
  <text x="78" y="116" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Pricing Review</text>
  <text x="30" y="132" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Loss runs:</text>
  <text x="94" y="132" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Received Jun 12</text>
  <text x="30" y="148" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Broker revisions:</text>
  <text x="136" y="148" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">2 prior submissions</text>
  <text x="30" y="164" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Prior decline:</text>
  <text x="106" y="164" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8b1a2c">Feb 2025 (undisclosed loss)</text>
  <text x="30" y="180" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Competitor expiry:</text>
  <text x="143" y="180" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Aug 31, 2026</text>
  <text x="30" y="196" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2b5080">Event log entries:</text>
  <text x="143" y="196" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">14  (incl. 2 prior declines)</text>

  <rect x="26" y="208" width="244" height="38" fill="#d8e2ed" rx="3" stroke="#b8c8dc" stroke-width="1"/>
  <text x="148" y="223" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a6a7a" font-style="italic" text-anchor="middle">PAS API: vendor-restricted · separate team required</text>
  <text x="148" y="238" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" font-style="italic" text-anchor="middle">Excluded from AI team MVP scope</text>

  <!-- DOC BUNDLE BOX -->
  <rect x="18" y="276" width="260" height="118" fill="#eeeceb" rx="5" stroke="#9a9898" stroke-width="1.5"/>
  <rect x="18" y="276" width="260" height="26" fill="#4a4858" rx="5"/>
  <rect x="18" y="290" width="260" height="12" fill="#4a4858"/>
  <text x="148" y="293" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Submission Document Bundle</text>

  <text x="30" y="318" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#5a5a70">▸  Application form  (PDF)</text>
  <text x="30" y="334" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#5a5a70">▸  Loss runs schedule  (PDF)</text>
  <text x="30" y="350" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#5a5a70">▸  Property risk report</text>
  <text x="30" y="374" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#1e6040" font-weight="bold">→ This is what the AI team connected</text>

  <!-- ============================== -->
  <!-- CONNECTION ZONE (x=278-408)   -->
  <!-- ============================== -->

  <!-- BROKEN: PAS center y≈166 → burgundy dashed toward agent -->
  <line x1="278" y1="166" x2="356" y2="205" stroke="#8b1a2c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="356" y="217" font-family="Calibri,Arial,sans-serif" font-size="16" fill="#8b1a2c" text-anchor="middle" font-weight="bold">✕</text>
  <text x="316" y="194" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" text-anchor="middle">no connection</text>

  <!-- WORKING: Doc bundle center y≈335 → steel-blue arrow to agent -->
  <line x1="278" y1="335" x2="406" y2="295" stroke="#2b5080" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="336" y="330" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2b5080" text-anchor="middle">documents</text>

  <!-- ============================== -->
  <!-- AI AGENT BOX (x=408-648)      -->
  <!-- ============================== -->
  <rect x="408" y="74" width="240" height="320" fill="#edeaf5" rx="5" stroke="#4a3575" stroke-width="1.5"/>
  <rect x="408" y="74" width="240" height="26" fill="#4a3575" rx="5"/>
  <rect x="408" y="88" width="240" height="12" fill="#4a3575"/>
  <text x="528" y="91" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Underwriting Agent</text>

  <text x="420" y="114" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a3575">Receives:</text>
  <text x="490" y="114" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Document bundle</text>
  <text x="420" y="130" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a3575">Task:</text>
  <text x="452" y="130" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">"What is the risk on this property?"</text>

  <line x1="420" y1="142" x2="636" y2="142" stroke="#c8c2dc" stroke-width="1"/>

  <text x="420" y="157" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a3575" font-weight="bold">Workflow context: unavailable</text>
  <text x="420" y="172" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa">✕  What stage is this submission?</text>
  <text x="420" y="186" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa">✕  New business or third re-submission?</text>
  <text x="420" y="200" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa">✕  Was this account ever declined?</text>
  <text x="420" y="214" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa">✕  Are loss runs complete or still outstanding?</text>
  <text x="420" y="228" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa">✕  Is competitor policy still in force?</text>
  <text x="420" y="245" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" font-style="italic">State lives in PAS · agent has no access</text>

  <line x1="420" y1="255" x2="636" y2="255" stroke="#c8c2dc" stroke-width="1"/>

  <text x="528" y="272" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38" text-anchor="middle" font-weight="bold">Output: Risk score returned</text>
  <text x="528" y="288" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a5c00" text-anchor="middle">Appears correct · Context incomplete</text>
  <text x="528" y="306" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a7a8a" text-anchor="middle" font-style="italic">Agent answered the question it was given.</text>
  <text x="528" y="320" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a7a8a" text-anchor="middle" font-style="italic">It didn't know what it wasn't given.</text>
  <text x="528" y="374" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#4a3575" text-anchor="middle">↓  see result</text>

  <!-- ============================== -->
  <!-- RESULT PANEL (x=666-984)      -->
  <!-- ============================== -->
  <text x="825" y="68" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8a8a9a" text-anchor="middle">WHAT HAPPENS</text>
  <rect x="666" y="74" width="318" height="320" fill="#faf9f6" rx="5" stroke="#c4c0b8" stroke-width="1"/>

  <!-- Demo -->
  <text x="680" y="99" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e6040">Demo environment:</text>
  <text x="680" y="115" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2d5a42">Submission #1 — clean new-business account</text>
  <text x="680" y="131" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2d5a42">No prior history · all documents complete</text>
  <text x="680" y="151" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#1e6040" font-weight="bold">✓  Agent correct → pilot approved</text>

  <line x1="680" y1="163" x2="972" y2="163" stroke="#d8d5ce" stroke-width="1"/>

  <!-- Production -->
  <text x="680" y="180" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8b1a2c">Production — six months later:</text>
  <text x="680" y="196" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a2030">Submission #47 — same property, new broker</text>
  <text x="680" y="212" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8b1a2c">Prior decline: Feb 2025 (undisclosed losses)</text>
  <text x="680" y="228" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8b1a2c">Broker revision #3 · competitor expiry in 60 days</text>
  <text x="680" y="248" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8b1a2c">Agent: recommends approval at standard rate</text>
  <text x="680" y="264" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a2030">Underwriter overrides · questions the agent</text>
  <text x="680" y="280" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8b1a2c" font-weight="bold">✕  Trust eroded → routed around → pilot stalls</text>

  <line x1="680" y1="293" x2="972" y2="293" stroke="#d8d5ce" stroke-width="1"/>

  <!-- Root cause box -->
  <rect x="680" y="302" width="286" height="76" fill="#fbeaed" rx="4" stroke="#8b1a2c" stroke-width="1"/>
  <text x="823" y="318" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#8b1a2c" text-anchor="middle">Root cause:</text>
  <text x="823" y="334" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a2030" text-anchor="middle">AI team scope = document → recommendation</text>
  <text x="823" y="350" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a2030" text-anchor="middle">PAS integration = different team, different budget</text>
  <text x="823" y="368" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9a8a8a" text-anchor="middle" font-style="italic">"Adding PAS context is scope creep." — project manager</text>

  <!-- ============================== -->
  <!-- FOOTER                        -->
  <!-- ============================== -->
  <rect x="0" y="412" width="1000" height="108" fill="#e8e6de"/>
  <line x1="0" y1="413" x2="1000" y2="413" stroke="#c4c0b8" stroke-width="1"/>
  <text x="500" y="436" font-family="Calibri,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The fix is not a better agent. The fix is a Work Record.</text>
  <text x="500" y="454" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#4a4858" text-anchor="middle">Model the unit of work · define its lifecycle · instantiate it · connect the agent to live state through the BPM engine</text>
  <text x="500" y="472" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#6a6a7a" text-anchor="middle">The agent didn't fail. It answered the question it was given. Nobody gave it the rest.</text>
  <text x="500" y="492" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">Freund 2026: 71% of organizations deploy AI agents · 11% of use cases reach production · the gap is domain understanding, not infrastructure</text>
  <text x="500" y="508" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#b0b0bc" text-anchor="middle">© 2026 Gary Samuelson · Work Record Series · CC BY-NC-ND 4.0</text>

</svg>
