<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="900" height="500" fill="#F8FAFC" rx="12"/>

  <!-- ═══════════════════════════════════════════
       TITLE BAR
       ═══════════════════════════════════════════ -->
  <rect x="10" y="10" width="880" height="38" fill="#4C1D95" rx="6"/>
  <text x="450" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#C4B5FD" font-style="italic">Forms 1–3 enter running instances and inherit three runtime dimensions. Form Four operates above — it governs the models that define what those dimensions will carry.</text>
  <text x="450" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Form Four: Governs the Process Model — Does Not Inherit from the Instance</text>

  <!-- ═══════════════════════════════════════════
       FORM FOUR BLOCK
       ═══════════════════════════════════════════ -->
  <rect x="10" y="52" width="880" height="100" fill="#5B21B6" rx="6"/>

  <!-- Left label -->
  <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Form Four</text>
  <text x="90" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C4B5FD">Process Model</text>
  <text x="90" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C4B5FD">Governance</text>
  <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">ProcessOS</text>

  <!-- Phase chip 1: Discover -->
  <rect x="178" y="60" width="165" height="82" fill="#6D28D9" rx="4"/>
  <text x="260" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">Discover</text>
  <text x="260" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">Mines event logs across</text>
  <text x="260" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">all instance populations</text>
  <text x="260" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">for structural bottleneck patterns</text>
  <text x="260" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">reads Persistence output</text>

  <!-- Phase chip 2: Re-engineer -->
  <rect x="353" y="60" width="165" height="82" fill="#6D28D9" rx="4"/>
  <text x="435" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">Re-engineer</text>
  <text x="435" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">Redesigns process model</text>
  <text x="435" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">for AI-native outcomes</text>
  <text x="435" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">against KPI fitness function</text>
  <text x="435" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">reshapes Gravity's obligations</text>

  <!-- Phase chip 3: Build & Deploy -->
  <rect x="528" y="60" width="165" height="82" fill="#6D28D9" rx="4"/>
  <text x="610" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">Build &amp; Deploy</text>
  <text x="610" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">Updated model through</text>
  <text x="610" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">human governance gate</text>
  <text x="610" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">before any instance runs against it</text>
  <text x="610" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">defines what Presence will hold</text>

  <!-- Phase chip 4: Continuously Improve -->
  <rect x="703" y="60" width="177" height="82" fill="#6D28D9" rx="4"/>
  <text x="791" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">Continuously Improve</text>
  <text x="791" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">KPI drift triggers next</text>
  <text x="791" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">Discover cycle automatically</text>
  <text x="791" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#C4B5FD">Organizational memory compounds</text>
  <text x="791" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#A78BFA">monitors all three dimensions at scale</text>

  <!-- ═══════════════════════════════════════════
       GOVERNS ARROW + BOUNDARY
       ═══════════════════════════════════════════ -->
  <line x1="450" y1="152" x2="450" y2="167" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="444,164 456,164 450,173" fill="#7C3AED"/>
  <text x="508" y="164" font-family="Arial, sans-serif" font-size="9" fill="#7C3AED" font-style="italic">governs the process model as a governed artifact</text>

  <!-- Boundary dashes -->
  <line x1="10" y1="177" x2="890" y2="177" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Mask rect so label sits cleanly over the dashed line -->
  <rect x="295" y="170" width="260" height="14" fill="#F8FAFC"/>
  <text x="450" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#7C3AED" font-style="italic">▲  Form Four operates above this boundary  ▲</text>

  <!-- ═══════════════════════════════════════════
       PROCESS MODEL BLOCK
       ═══════════════════════════════════════════ -->
  <rect x="10" y="185" width="880" height="100" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="6"/>

  <text x="450" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4C1D95">Process Model — The Governed Artifact</text>
  <text x="450" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5B21B6" font-style="italic">Form Four writes here. Forms 1–3 execute within instances of this artifact.</text>

  <!-- What the process model encodes for each dimension -->
  <!-- Presence encoding -->
  <rect x="22" y="228" width="270" height="47" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" rx="4"/>
  <text x="157" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1D4ED8">Encodes Presence</text>
  <text x="157" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1D4ED8">Task definitions, variable schemas,</text>
  <text x="157" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1D4ED8">input/output contracts per task node</text>

  <!-- Gravity encoding -->
  <rect x="315" y="228" width="270" height="47" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" rx="4"/>
  <text x="450" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#92400E">Encodes Gravity</text>
  <text x="450" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#92400E">Task sequencing, pre-conditions,</text>
  <text x="450" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#92400E">obligation triggers, confidence gates</text>

  <!-- Persistence encoding -->
  <rect x="608" y="228" width="270" height="47" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" rx="4"/>
  <text x="743" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#166534">Encodes Persistence</text>
  <text x="743" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#166534">Lifecycle states, passivation points,</text>
  <text x="743" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#166534">token survival rules across system events</text>

  <!-- ═══════════════════════════════════════════
       INSTANTIATES ARROW + BOUNDARY
       ═══════════════════════════════════════════ -->
  <line x1="450" y1="285" x2="450" y2="300" stroke="#475569" stroke-width="1.5"/>
  <polygon points="444,297 456,297 450,306" fill="#475569"/>
  <text x="508" y="298" font-family="Arial, sans-serif" font-size="9" fill="#475569" font-style="italic">instantiates into running instances that inherit...</text>

  <!-- Boundary dashes -->
  <line x1="10" y1="310" x2="890" y2="310" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Mask rect -->
  <rect x="278" y="303" width="280" height="14" fill="#F8FAFC"/>
  <text x="450" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#475569" font-style="italic">▼  Forms 1–3 enter running instances within this boundary  ▼</text>

  <!-- ═══════════════════════════════════════════
       INSTANCE LEVEL — THREE DIMENSION COLUMNS
       ═══════════════════════════════════════════ -->

  <!-- ── Presence column ── -->
  <rect x="10" y="320" width="278" height="136" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" rx="6"/>
  <!-- Header -->
  <rect x="10" y="320" width="278" height="28" fill="#2563EB" rx="6"/>
  <rect x="10" y="336" width="278" height="12" fill="#2563EB"/>
  <text x="149" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Presence</text>
  <!-- Body -->
  <text x="149" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1D4ED8">Running instance occupies memory,</text>
  <text x="149" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1D4ED8">holds variable store, tracks position</text>
  <text x="149" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1D4ED8">in the execution graph.</text>
  <!-- Separator -->
  <line x1="26" y1="396" x2="272" y2="396" stroke="#BFDBFE" stroke-width="1"/>
  <!-- Form Four note -->
  <text x="149" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3B82F6" font-style="italic">Form Four shapes what the variable</text>
  <text x="149" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3B82F6" font-style="italic">store will contain in the next model.</text>
  <!-- Instance note -->
  <text x="149" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#2563EB">Forms 1–3 receive this as live state.</text>

  <!-- ── Gravity column ── -->
  <rect x="311" y="320" width="278" height="136" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" rx="6"/>
  <!-- Header -->
  <rect x="311" y="320" width="278" height="28" fill="#D97706" rx="6"/>
  <rect x="311" y="336" width="278" height="12" fill="#D97706"/>
  <text x="450" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Gravity</text>
  <!-- Body -->
  <text x="450" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#92400E">From instantiation, Work Record generates</text>
  <text x="450" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#92400E">obligations: task assignments, service</text>
  <text x="450" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#92400E">calls, timer events.</text>
  <!-- Separator -->
  <line x1="327" y1="396" x2="573" y2="396" stroke="#FDE68A" stroke-width="1"/>
  <!-- Form Four note -->
  <text x="450" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#B45309" font-style="italic">Form Four reshapes which obligations</text>
  <text x="450" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#B45309" font-style="italic">future instances generate — and when.</text>
  <!-- Instance note -->
  <text x="450" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#D97706">Forms 1–3 are summoned by this gravity.</text>

  <!-- ── Persistence column ── -->
  <rect x="612" y="320" width="278" height="136" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" rx="6"/>
  <!-- Header -->
  <rect x="612" y="320" width="278" height="28" fill="#16A34A" rx="6"/>
  <rect x="612" y="336" width="278" height="12" fill="#16A34A"/>
  <text x="751" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Persistence</text>
  <!-- Body -->
  <text x="751" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#166534">Instance survives restarts, personnel</text>
  <text x="751" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#166534">changes, and the full lifespan of</text>
  <text x="751" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#166534">long-running work. Token survives.</text>
  <!-- Separator -->
  <line x1="628" y1="396" x2="874" y2="396" stroke="#BBF7D0" stroke-width="1"/>
  <!-- Form Four note -->
  <text x="751" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#15803D" font-style="italic">Form Four mines the event logs that</text>
  <text x="751" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#15803D" font-style="italic">Persistence accumulates — then improves the model.</text>
  <!-- Instance note -->
  <text x="751" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#16A34A">Forms 1–3 execute inside this continuity.</text>

  <!-- ═══════════════════════════════════════════
       CAPTION
       ═══════════════════════════════════════════ -->
  <text x="450" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B" font-style="italic">Forms 1–3 enter running instances and inherit Presence, Gravity, and Persistence as runtime properties. Form Four governs the process models that define what those properties carry in every instance that follows.</text>

</svg>
