<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <marker id="tw-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4858"/>
    </marker>
    <marker id="tw-arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2b5080"/>
    </marker>
    <marker id="tw-arr-burg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b1a2c"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect width="1000" height="500" fill="#f6f4ef"/>
  <!-- Left panel subtle warm tint -->
  <rect x="0" y="0" width="487" height="436" fill="#fdfcf8" opacity="0.6"/>
  <!-- Right panel subtle cool tint -->
  <rect x="513" y="0" width="487" height="436" fill="#f0f4fa" opacity="0.4"/>
  <!-- Divider strip -->
  <rect x="487" y="0" width="26" height="436" fill="#e8e6de"/>
  <text x="500" y="222" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#9a9898" text-anchor="middle">vs</text>

  <!-- FULL-WIDTH TITLE -->
  <text x="500" y="27" font-family="Calibri,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The Document Is Not the Work</text>
  <text x="500" y="46" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#6a6a7a" text-anchor="middle">Sterile world assumption vs. business reality — the gap that produces Stateless Deployment</text>

  <!-- ============================================ -->
  <!-- LEFT PANEL: The Sterile World Assumption     -->
  <!-- ============================================ -->

  <text x="244" y="68" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#4a4858" text-anchor="middle">The Sterile World Assumption</text>
  <text x="244" y="84" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8a8a9a" text-anchor="middle">What the agent was built to expect</text>

  <!-- Agent's bounded world (dashed border) -->
  <rect x="96" y="98" width="296" height="306" fill="none" stroke="#c4c0b8" stroke-width="1.2" stroke-dasharray="6,4" rx="6"/>
  <text x="112" y="112" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#b4b0a8" font-style="italic">agent's world</text>

  <!-- Document icon -->
  <rect x="210" y="124" width="68" height="86" fill="#eeeceb" rx="3" stroke="#4a4858" stroke-width="1.5"/>
  <polygon points="256,124 278,124 278,146" fill="#c8c5be"/>
  <line x1="256" y1="124" x2="256" y2="146" stroke="#4a4858" stroke-width="1"/>
  <line x1="256" y1="146" x2="278" y2="146" stroke="#4a4858" stroke-width="1"/>
  <line x1="220" y1="160" x2="250" y2="160" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="220" y1="174" x2="268" y2="174" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="220" y1="188" x2="240" y2="188" stroke="#b0ada8" stroke-width="1.2"/>
  <text x="244" y="222" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a4858" text-anchor="middle">Document</text>
  <text x="244" y="234" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle">(self-contained object)</text>

  <!-- Arrow: doc → agent -->
  <line x1="244" y1="238" x2="244" y2="264" stroke="#4a4858" stroke-width="1.5" marker-end="url(#tw-arr)"/>

  <!-- Agent box -->
  <rect x="164" y="266" width="160" height="54" fill="#edeaf5" rx="5" stroke="#4a3575" stroke-width="1.5"/>
  <text x="244" y="288" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2a2a38" text-anchor="middle">AI Agent</text>
  <text x="244" y="304" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a6aaa" text-anchor="middle">Reasons on document</text>

  <!-- Arrow: agent → output -->
  <line x1="244" y1="322" x2="244" y2="354" stroke="#4a4858" stroke-width="1.5" marker-end="url(#tw-arr)"/>

  <!-- Output node -->
  <circle cx="244" cy="372" r="24" fill="#eeeceb" stroke="#4a4858" stroke-width="1.5"/>
  <text x="244" y="369" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a2a38" text-anchor="middle">Risk</text>
  <text x="244" y="382" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#2a2a38" text-anchor="middle">Score</text>

  <!-- Caption -->
  <text x="244" y="420" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle" font-style="italic">Every submission looks the same.</text>
  <text x="244" y="433" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b1a2c" text-anchor="middle" font-style="italic">Each treated as a fresh, context-free object.</text>

  <!-- ============================================ -->
  <!-- RIGHT PANEL: Business Reality               -->
  <!-- ============================================ -->

  <text x="756" y="68" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2b5080" text-anchor="middle">Business Reality</text>
  <text x="756" y="84" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#8a8a9a" text-anchor="middle">The same artifact, embedded in its actual context</text>

  <!-- Document icon (center) — same size to show equivalence -->
  <rect x="722" y="192" width="68" height="86" fill="#eeeceb" rx="3" stroke="#4a4858" stroke-width="1.5"/>
  <polygon points="768,192 790,192 790,214" fill="#c8c5be"/>
  <line x1="768" y1="192" x2="768" y2="214" stroke="#4a4858" stroke-width="1"/>
  <line x1="768" y1="214" x2="790" y2="214" stroke="#4a4858" stroke-width="1"/>
  <line x1="732" y1="226" x2="762" y2="226" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="732" y1="240" x2="780" y2="240" stroke="#b0ada8" stroke-width="1.2"/>
  <line x1="732" y1="254" x2="752" y2="254" stroke="#b0ada8" stroke-width="1.2"/>
  <text x="756" y="290" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#4a4858" text-anchor="middle">Same document.</text>

  <!-- Context nodes — hub and spoke -->

  <!-- TOP: Stage position -->
  <rect x="686" y="104" width="140" height="36" fill="#e8edf5" rx="4" stroke="#2b5080" stroke-width="1.2"/>
  <text x="756" y="119" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#2b5080" text-anchor="middle">Stage 3: Pricing Review</text>
  <text x="756" y="133" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#5a6a7a" text-anchor="middle">current lifecycle position</text>
  <line x1="756" y1="140" x2="756" y2="192" stroke="#2b5080" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#tw-arr-blue)"/>

  <!-- NE: Event log -->
  <rect x="822" y="128" width="150" height="36" fill="#e8edf5" rx="4" stroke="#2b5080" stroke-width="1.2"/>
  <text x="897" y="143" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#2b5080" text-anchor="middle">Event log: 14 entries</text>
  <text x="897" y="157" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#5a6a7a" text-anchor="middle">full transition history</text>
  <line x1="822" y1="146" x2="790" y2="214" stroke="#2b5080" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- SE: Prior decline -->
  <rect x="822" y="294" width="150" height="36" fill="#fbeaed" rx="4" stroke="#8b1a2c" stroke-width="1.2"/>
  <text x="897" y="309" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#8b1a2c" text-anchor="middle">Prior decline: Feb 2025</text>
  <text x="897" y="323" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7a2030" text-anchor="middle">undisclosed loss history</text>
  <line x1="822" y1="312" x2="790" y2="258" stroke="#8b1a2c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- BOTTOM: Broker revision -->
  <rect x="686" y="330" width="140" height="36" fill="#fbeaed" rx="4" stroke="#8b1a2c" stroke-width="1.2"/>
  <text x="756" y="345" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#8b1a2c" text-anchor="middle">Broker revision #3</text>
  <text x="756" y="359" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7a2030" text-anchor="middle">same account, 3rd attempt</text>
  <line x1="756" y1="330" x2="756" y2="278" stroke="#8b1a2c" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#tw-arr-burg)"/>

  <!-- SW: Competitor expiry -->
  <rect x="532" y="294" width="150" height="36" fill="#e8edf5" rx="4" stroke="#2b5080" stroke-width="1.2"/>
  <text x="607" y="309" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#2b5080" text-anchor="middle">Comp. expiry: Aug 31</text>
  <text x="607" y="323" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#5a6a7a" text-anchor="middle">competitor policy timing</text>
  <line x1="682" y1="312" x2="722" y2="258" stroke="#2b5080" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- NW: Account history -->
  <rect x="532" y="128" width="150" height="36" fill="#e8edf5" rx="4" stroke="#2b5080" stroke-width="1.2"/>
  <text x="607" y="143" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#2b5080" text-anchor="middle">Account history: 3 yrs</text>
  <text x="607" y="157" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#5a6a7a" text-anchor="middle">carrier relationship context</text>
  <line x1="682" y1="146" x2="722" y2="214" stroke="#2b5080" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Caption -->
  <text x="756" y="420" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8a8a9a" text-anchor="middle" font-style="italic">The document is the surface.</text>
  <text x="756" y="433" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#1a1a2e" text-anchor="middle" font-style="italic">The context is what it belongs to.</text>

  <!-- ============================================ -->
  <!-- FOOTER                                       -->
  <!-- ============================================ -->
  <rect x="0" y="444" width="1000" height="56" fill="#e8e6de"/>
  <line x1="0" y1="445" x2="1000" y2="445" stroke="#c4c0b8" stroke-width="1"/>
  <text x="500" y="464" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The Work Record carries what the document cannot: history, lifecycle position, prior decisions,</text>
  <text x="500" y="481" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">the binding of this specific work to the business reality it exists in.</text>

</svg>
