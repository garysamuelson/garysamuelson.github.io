<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a6a7a"/>
    </marker>
    <marker id="arr-gold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b6000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="590" fill="#f6f4ef"/>

  <!-- Title -->
  <text x="500" y="34" font-family="Calibri,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">The Agent Freed Upward</text>
  <text x="500" y="57" font-family="Calibri,Arial,sans-serif" font-size="12" fill="#6a6a7a" text-anchor="middle">Form One → Two → Four · Deterministic rules grow from below · Form Three expands above · Agent rises</text>

  <!-- Phase headers -->
  <text x="155" y="72" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#6a6a7a" text-anchor="middle">Phase 1 — Recommendation</text>
  <text x="470" y="72" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#6a6a7a" text-anchor="middle">Phase 2 — Auto-Approve</text>
  <text x="785" y="72" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#7a5c00" text-anchor="middle">Phase 3 — ProcessOS Active</text>

  <!-- ═══════════════════════════════
       PHASE 1  x=50, w=210
       Form Three:    y=75,  h=64   ends 139
       Form One:      y=141, h=237  ends 378
       Deterministic: y=380, h=50   ends 430
       ═══════════════════════════════ -->

  <!-- Form Three band -->
  <rect x="50" y="75" width="210" height="64" fill="#1e6040" rx="3"/>
  <!-- Form One band -->
  <rect x="50" y="141" width="210" height="237" fill="#4a3575" rx="3"/>
  <!-- Deterministic band -->
  <rect x="50" y="380" width="210" height="50" fill="#2b5080" rx="3"/>

  <!-- Phase 1 text -->
  <text x="155" y="102" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#e8f7ef" text-anchor="middle">Form Three (18%) — Genuine Complexity</text>

  <text x="155" y="217" font-family="Calibri,Arial,sans-serif" font-size="14" font-weight="bold" fill="#f0ecf8" text-anchor="middle">Form One</text>
  <text x="155" y="236" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#e4dff5" text-anchor="middle">Agent recommends · Human decides</text>
  <text x="155" y="256" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#d4c8f0" text-anchor="middle">68% of work scope</text>
  <text x="155" y="284" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#c0b0e8" text-anchor="middle">Event log accumulates per-instance</text>
  <text x="155" y="299" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#b0a0d8" text-anchor="middle">↗  Form Four's raw material</text>

  <text x="155" y="401" font-family="Calibri,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d4e8f8" text-anchor="middle">Deterministic (12%) — Legacy rules</text>

  <!-- Agent focus zone: Form One area -->
  <rect x="45" y="136" width="220" height="244" fill="#b08000" fill-opacity="0.07" stroke="#b08000" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="155" y="443" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b6000" text-anchor="middle">◈ Agent primary zone</text>

  <!-- ═══════════════════════════════
       PHASE 2  x=365, w=210
       Form Three:    y=75,  h=110  ends 185
       Form Two:      y=187, h=100  ends 287
       Deterministic: y=289, h=141  ends 430
       ═══════════════════════════════ -->

  <!-- Form Three band -->
  <rect x="365" y="75" width="210" height="110" fill="#1e6040" rx="3"/>
  <!-- Form Two band -->
  <rect x="365" y="187" width="210" height="100" fill="#8b5e00" rx="3"/>
  <!-- Deterministic band -->
  <rect x="365" y="289" width="210" height="141" fill="#2b5080" rx="3"/>

  <!-- Phase 2 text -->
  <text x="470" y="112" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#e8f7ef" text-anchor="middle">Form Three (31%)</text>
  <text x="470" y="129" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#cceede" text-anchor="middle">Genuine complexity — expanding</text>
  <text x="470" y="145" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#a8d8bf" text-anchor="middle">↑ Agent quality increases</text>
  <text x="470" y="159" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#88c8a8" text-anchor="middle">Routine has unloaded</text>

  <text x="470" y="228" font-family="Calibri,Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff5d4" text-anchor="middle">Form Two</text>
  <text x="470" y="246" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#f5d878" text-anchor="middle">Agent auto-approves</text>
  <text x="470" y="262" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#e8c640" text-anchor="middle">within DMN boundary</text>
  <text x="470" y="278" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#d4b030" text-anchor="middle">28% of work scope</text>

  <text x="470" y="336" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d4e8f8" text-anchor="middle">Deterministic (40%)</text>
  <text x="470" y="354" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#b8d8f4" text-anchor="middle">Form One patterns hardened</text>
  <text x="470" y="370" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#9cc8ec" text-anchor="middle">into BPMN / DMN rules</text>
  <text x="470" y="392" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#d4b030" text-anchor="middle">Form Four (ProcessOS) drives this ▲</text>

  <!-- Agent focus zone: Form Two + Form Three -->
  <rect x="360" y="78" width="220" height="215" fill="#b08000" fill-opacity="0.07" stroke="#b08000" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="470" y="443" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#8b6000" text-anchor="middle">◈ Agent primary zone (rising)</text>

  <!-- ═══════════════════════════════
       PHASE 3  x=680, w=210
       Form Three:    y=75,  h=135  ends 210
       Form Two:      y=212, h=37   ends 249
       Deterministic: y=251, h=179  ends 430
       ═══════════════════════════════ -->

  <!-- Form Three band — agent's apex domain -->
  <rect x="680" y="75" width="210" height="135" fill="#164f34" rx="3"/>
  <!-- Inner highlight on Form Three Phase 3 -->
  <rect x="682" y="77" width="206" height="131" fill="#276749" fill-opacity="0.15" rx="2"/>
  <!-- Form Two band — thin residual boundary -->
  <rect x="680" y="212" width="210" height="37" fill="#8b5e00" rx="3"/>
  <!-- Deterministic band — dominant base -->
  <rect x="680" y="251" width="210" height="179" fill="#2b5080" rx="3"/>

  <!-- Phase 3 text -->
  <text x="785" y="107" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#cceede" text-anchor="middle">Form Three (38%)</text>
  <text x="785" y="125" font-family="Calibri,Arial,sans-serif" font-size="11" fill="#b8e8d0" text-anchor="middle">Agent's primary domain</text>
  <text x="785" y="142" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#a8d8bf" text-anchor="middle">Novel · Ambiguous · Complex</text>
  <text x="785" y="159" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#88c8a8" text-anchor="middle">Freed from routine</text>
  <text x="785" y="178" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#70b892" text-anchor="middle">Highest-value agent work</text>
  <text x="785" y="194" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#70b892" text-anchor="middle">ProcessOS continuously improves</text>

  <text x="785" y="234" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#fff5d4" text-anchor="middle">Form Two — 10% (boundary enforcement only)</text>

  <text x="785" y="298" font-family="Calibri,Arial,sans-serif" font-size="12" font-weight="bold" fill="#d4e8f8" text-anchor="middle">Deterministic (52%)</text>
  <text x="785" y="317" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#b8d8f4" text-anchor="middle">ProcessOS governs</text>
  <text x="785" y="333" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#b8d8f4" text-anchor="middle">BPMN / DMN at scale</text>
  <text x="785" y="353" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9cc8ec" text-anchor="middle">Majority of work runs here</text>
  <text x="785" y="369" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#9cc8ec" text-anchor="middle">without agent involvement</text>
  <text x="785" y="389" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7ab0dc" text-anchor="middle">Near-zero cost · Complete audit</text>
  <text x="785" y="408" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7ab0dc" text-anchor="middle">Form Three freed upward ▲</text>

  <!-- Agent focus zone: Form Three only — apex, thicker border -->
  <rect x="675" y="78" width="220" height="137" fill="#b08000" fill-opacity="0.10" stroke="#8b6000" stroke-width="2.5" stroke-dasharray="6,3" rx="4"/>
  <text x="785" y="443" font-family="Calibri,Arial,sans-serif" font-size="9" font-weight="bold" fill="#7a5c00" text-anchor="middle">◈ Agent primary zone — APEX</text>

  <!-- ─── Transition arrows ─── -->
  <!-- Arrow 1: Phase 1 → 2 at y=252 -->
  <line x1="268" y1="252" x2="357" y2="252" stroke="#6a6a7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="312" y="243" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a5a70" text-anchor="middle">Process mining</text>
  <text x="312" y="257" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#5a5a70" text-anchor="middle">→ DMN rules</text>
  <text x="312" y="271" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7a7a8a" text-anchor="middle">Form Four begins</text>

  <!-- Arrow 2: Phase 2 → 3 at y=252 -->
  <line x1="583" y1="252" x2="672" y2="252" stroke="#8b6000" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <text x="627" y="243" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a5c00" text-anchor="middle">ProcessOS</text>
  <text x="627" y="257" font-family="Calibri,Arial,sans-serif" font-size="9" fill="#7a5c00" text-anchor="middle">active</text>
  <text x="627" y="271" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#6a4c00" text-anchor="middle">D → R → D → I</text>

  <!-- ─── ProcessOS footer ─── -->
  <line x1="50" y1="452" x2="900" y2="452" stroke="#c4c0b8" stroke-width="1"/>
  <text x="475" y="469" font-family="Calibri,Arial,sans-serif" font-size="11" font-weight="bold" fill="#7a5c00" text-anchor="middle">▲  Form Four — ProcessOS: Discover → Re-engineer → Deploy → Continuously Improve</text>
  <text x="475" y="485" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#5a5a70" text-anchor="middle">mines event logs from Forms One and Two · hardens patterns into BPMN/DMN · governs the process model lifecycle above the execution layer</text>

  <!-- ─── Legend ─── -->
  <rect x="50" y="503" width="12" height="12" fill="#1e6040" rx="2"/>
  <text x="68" y="513" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Form Three — Genuine complexity (agent's expanding domain)</text>

  <rect x="50" y="522" width="12" height="12" fill="#4a3575" rx="2"/>
  <text x="68" y="532" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Form One — Recommendation mode (event log data source → Form Four input)</text>

  <rect x="50" y="541" width="12" height="12" fill="#8b5e00" rx="2"/>
  <text x="68" y="551" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Form Two — Agent auto-approves within DMN boundary</text>

  <rect x="490" y="503" width="12" height="12" fill="#2b5080" rx="2"/>
  <text x="508" y="513" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#2a2a38">Deterministic — Patterns hardened by ProcessOS into BPMN/DMN rules</text>

  <rect x="490" y="522" width="12" height="12" fill="none" stroke="#8b6000" stroke-width="1.5" stroke-dasharray="4,2" rx="2"/>
  <text x="508" y="532" font-family="Calibri,Arial,sans-serif" font-size="10" fill="#7a5c00">◈ Agent primary work zone (rises phase to phase)</text>

  <!-- Bottom notes -->
  <text x="475" y="566" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#7a7a8a" text-anchor="middle">The sequence is not reversible. Form Four cannot begin without event logs. Event logs do not exist without running instances. Instances do not exist without the Work Record class definition.</text>
  <text x="475" y="579" font-family="Calibri,Arial,sans-serif" font-size="8" fill="#9a9aaa" text-anchor="middle">Gary Samuelson 2026 · Work Record Series · a_business_needs_state_ai_agents_and_rules</text>
</svg>