<svg width="920" height="440" viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="920" height="440" fill="#0d1320"/>

  <!-- ─── TITLE BAR ─── -->
  <rect x="16" y="14" width="888" height="36" fill="#0a1f2e" rx="6"/>
  <text x="460" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">THE FOUNDATION ALREADY EXISTS — A CONVERGENCE</text>

  <!-- ─── LEFT BOX: BPM Practitioner ─── -->
  <rect x="16" y="62" width="224" height="175" fill="#1a2540" rx="8" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="128" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">BPM PRACTITIONER</text>
  <text x="128" y="100" text-anchor="middle" font-size="10" fill="#64748b">brings</text>
  <line x1="36" y1="110" x2="220" y2="110" stroke="#1e3a5f" stroke-width="1"/>
  <text x="34" y="128" font-size="10" fill="#38bdf8">▸</text>
  <text x="50" y="128" font-size="11" fill="#e2e8f0">Work Record</text>
  <text x="34" y="147" font-size="10" fill="#38bdf8">▸</text>
  <text x="50" y="147" font-size="11" fill="#e2e8f0">Governance Model</text>
  <text x="34" y="166" font-size="10" fill="#38bdf8">▸</text>
  <text x="50" y="166" font-size="11" fill="#e2e8f0">Measurement Framework</text>
  <text x="34" y="185" font-size="10" fill="#38bdf8">▸</text>
  <text x="50" y="185" font-size="11" fill="#e2e8f0">Deployment Architecture</text>
  <line x1="36" y1="198" x2="220" y2="198" stroke="#1e3a5f" stroke-width="1"/>
  <text x="128" y="218" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">25 years in production</text>

  <!-- ─── CENTER BOX: Same Problem ─── -->
  <!-- Outer glow -->
  <rect x="270" y="52" width="380" height="248" fill="none" rx="9" stroke="#4ade80" stroke-width="8" opacity="0.10"/>
  <!-- Main box -->
  <rect x="270" y="52" width="380" height="248" fill="#0a1f2e" rx="9" stroke="#4ade80" stroke-width="2"/>

  <text x="460" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1">SAME PROBLEM</text>
  <text x="460" y="93" text-anchor="middle" font-size="10" fill="#64748b">the trillion-dollar agentic workflow opportunity</text>
  <line x1="290" y1="103" x2="630" y2="103" stroke="#1e3a5f" stroke-width="1"/>

  <text x="460" y="122" text-anchor="middle" font-size="12" fill="#e2e8f0">The foundation isn't waiting to be built.</text>
  <text x="460" y="140" text-anchor="middle" font-size="12" fill="#e2e8f0">It exists. Running in production today.</text>
  <text x="460" y="158" text-anchor="middle" font-size="11" fill="#8b9db5">Its trajectory is directly toward what Jones describes.</text>
  <line x1="290" y1="170" x2="630" y2="170" stroke="#1e3a5f" stroke-width="1"/>

  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">Neither needs to win the framing war.</text>
  <text x="460" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">They need to be</text>
  <text x="460" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#4ade80">in the same room.</text>
  <line x1="290" y1="252" x2="630" y2="252" stroke="#1e3a5f" stroke-width="1"/>

  <text x="460" y="272" text-anchor="middle" font-size="11" fill="#7dd3fc">Common ground: The Work Record.</text>
  <text x="460" y="288" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">the structural object both sides already understand</text>

  <!-- ─── RIGHT BOX: AI Product Designer ─── -->
  <rect x="680" y="62" width="224" height="175" fill="#1a2540" rx="8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="792" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">AI PRODUCT DESIGNER</text>
  <text x="792" y="100" text-anchor="middle" font-size="10" fill="#64748b">brings</text>
  <line x1="700" y1="110" x2="884" y2="110" stroke="#1e3a5f" stroke-width="1"/>
  <text x="698" y="128" font-size="10" fill="#38bdf8">▸</text>
  <text x="712" y="128" font-size="11" fill="#e2e8f0">Agent Capability</text>
  <text x="698" y="147" font-size="10" fill="#38bdf8">▸</text>
  <text x="712" y="147" font-size="11" fill="#e2e8f0">User-Facing Framing</text>
  <text x="698" y="166" font-size="10" fill="#38bdf8">▸</text>
  <text x="712" y="166" font-size="11" fill="#e2e8f0">Business Case</text>
  <text x="698" y="185" font-size="10" fill="#38bdf8">▸</text>
  <text x="712" y="185" font-size="11" fill="#e2e8f0">Market Momentum</text>
  <line x1="700" y1="198" x2="884" y2="198" stroke="#1e3a5f" stroke-width="1"/>
  <text x="792" y="218" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">the market timing is now</text>

  <!-- ─── ARROWS (both converging toward center) ─── -->
  <!-- Arrow 1: Left → Center (right-pointing) -->
  <text x="254" y="148" text-anchor="middle" font-size="9" fill="#64748b">brings</text>
  <line x1="242" y1="155" x2="264" y2="155" stroke="#0ea5e9" stroke-width="1.5"/>
  <polygon points="270,155 263,151 263,159" fill="#0ea5e9"/>

  <!-- Arrow 2: Right → Center (left-pointing) -->
  <text x="666" y="148" text-anchor="middle" font-size="9" fill="#64748b">brings</text>
  <line x1="678" y1="155" x2="656" y2="155" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="650,155 657,151 657,159" fill="#38bdf8"/>

  <!-- ─── EQUATION ROW ─── -->
  <rect x="16" y="314" width="888" height="90" fill="#0a1f2e" rx="8" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="238" y1="324" x2="238" y2="394" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="460" y1="324" x2="460" y2="394" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="682" y1="324" x2="682" y2="394" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Eq 1: Work Record = Task Object -->
  <text x="127" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Work Record</text>
  <text x="127" y="363" text-anchor="middle" font-size="12" fill="#38bdf8">= Task Object</text>
  <text x="127" y="381" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">structured work unit</text>

  <!-- Eq 2: Agent = Worker -->
  <text x="349" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Agent</text>
  <text x="349" y="363" text-anchor="middle" font-size="12" fill="#38bdf8">= Worker</text>
  <text x="349" y="381" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">assigned executor</text>

  <!-- Eq 3: Process Engine = Integration Substrate -->
  <text x="571" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Process Engine</text>
  <text x="571" y="363" text-anchor="middle" font-size="12" fill="#38bdf8">= Integration Substrate</text>
  <text x="571" y="381" text-anchor="middle" font-size="11" fill="#8b9db5" font-style="italic">coherent data layer</text>

  <!-- Eq 4: $1T = What to run first -->
  <text x="793" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">$1 Trillion</text>
  <text x="793" y="363" text-anchor="middle" font-size="12" fill="#4ade80">= What to run first.</text>
  <text x="793" y="381" text-anchor="middle" font-size="10" fill="#4ade80" font-style="italic">the only question left</text>

  <!-- Bottom caption -->
  <text x="460" y="422" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">The BPM practitioner and the AI product designer are working on the same problem. The Work Record is the common ground.</text>

</svg>
