<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="780" height="460" rx="12" ry="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="390" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">The Architectural Foundation</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#6b7280">Two structural principles that define where AI legitimately belongs</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CARD 1: Task Abstraction / Worker Binding          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="18" y="78" width="744" height="130" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="32" y="100" font-size="13" font-weight="700" fill="#374151">The BPM Task Is Abstract — the Worker Is Bound by the Process Model</text>

  <!-- Task box -->
  <rect x="32" y="114" width="155" height="78" rx="6" ry="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <rect x="32" y="114" width="5" height="78" rx="2" ry="2" fill="#f97316"/>
  <text x="114" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Task</text>
  <text x="114" y="158" text-anchor="middle" font-size="10" fill="#9a3412">abstract container</text>
  <text x="114" y="175" text-anchor="middle" font-size="9.5" fill="#6b7280">what gets done, not who</text>

  <!-- Lines from task to worker pills -->
  <line x1="190" y1="153" x2="246" y2="128" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="190" y1="153" x2="246" y2="153" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="190" y1="153" x2="246" y2="178" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- Worker pills -->
  <rect x="250" y="115" width="138" height="26" rx="13" ry="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="319" y="132" text-anchor="middle" font-size="10.5" fill="#374151">Human Worker</text>

  <rect x="250" y="140" width="138" height="26" rx="13" ry="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="319" y="157" text-anchor="middle" font-size="10.5" fill="#374151">System Service</text>

  <rect x="250" y="165" width="138" height="26" rx="13" ry="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="319" y="182" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">AI Agent</text>

  <!-- Right annotation -->
  <rect x="510" y="119" width="240" height="68" rx="6" ry="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="630" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">AI does not replace BPM tasks.</text>
  <text x="630" y="159" text-anchor="middle" font-size="11" fill="#374151">AI becomes a kind of worker</text>
  <text x="630" y="176" text-anchor="middle" font-size="11" fill="#374151">that the process model assigns.</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CARD 2: Service Consumption Principle              -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="18" y="220" width="744" height="220" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="32" y="242" font-size="13" font-weight="700" fill="#374151">The Service Consumption Principle</text>

  <!-- Cummins quote -->
  <rect x="32" y="252" width="498" height="42" rx="4" ry="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="270" font-size="11.5" font-style="italic" fill="#1e40af">"Each value chain is a use case of the services it uses."</text>
  <text x="46" y="286" font-size="9.5" fill="#9ca3af">— Cummins 2010</text>

  <!-- Chain label -->
  <text x="32" y="316" font-size="9.5" font-weight="700" fill="#9ca3af" letter-spacing="0.8">SERVICE CONSUMPTION CHAIN</text>

  <!-- Business Model -->
  <rect x="32" y="324" width="95" height="48" rx="5" ry="5" fill="#f0fdf4" stroke="#10b981" stroke-width="1.3"/>
  <text x="79" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Business</text>
  <text x="79" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Model</text>
  <line x1="130" y1="348" x2="145" y2="348" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Value Chain Activity -->
  <rect x="149" y="324" width="108" height="48" rx="5" ry="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="203" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Value Chain</text>
  <text x="203" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Activity</text>
  <line x1="260" y1="348" x2="275" y2="348" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Process Model -->
  <rect x="279" y="324" width="100" height="48" rx="5" ry="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="329" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Process</text>
  <text x="329" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Model</text>
  <line x1="382" y1="348" x2="397" y2="348" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Task -->
  <rect x="401" y="324" width="82" height="48" rx="5" ry="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <text x="442" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">Task</text>
  <text x="442" y="359" text-anchor="middle" font-size="9" fill="#6b7280">(abstract)</text>
  <line x1="486" y1="348" x2="501" y2="348" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Service Layer box -->
  <rect x="505" y="305" width="241" height="120" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="625" y="323" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Service Layer</text>

  <!-- Service pills — row 1 -->
  <rect x="513" y="330" width="68" height="20" rx="10" ry="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="547" y="344" text-anchor="middle" font-size="9" fill="#374151">Data Svcs</text>

  <rect x="587" y="330" width="68" height="20" rx="10" ry="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="621" y="344" text-anchor="middle" font-size="9" fill="#374151">Bus. Rules</text>

  <rect x="661" y="330" width="72" height="20" rx="10" ry="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="697" y="344" text-anchor="middle" font-size="9" fill="#374151">Integration</text>

  <!-- Service pills — row 2 -->
  <rect x="513" y="356" width="82" height="20" rx="10" ry="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="554" y="370" text-anchor="middle" font-size="9" fill="#374151">Human-task UI</text>

  <!-- AI pill — highlighted, full-width -->
  <rect x="513" y="382" width="220" height="28" rx="14" ry="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="623" y="400" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">AI / Agent  ←  enters the architecture here</text>

  <!-- Footnote -->
  <text x="390" y="452" text-anchor="middle" font-size="10" fill="#9ca3af">Cummins 2010 · OMG 2011 · Samuelson 2016</text>

</svg>
