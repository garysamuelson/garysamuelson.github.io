<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica,Arial,system-ui,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
    <marker id="mD" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <marker id="mB" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid for technical feel -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect width="1200" height="5" fill="url(#accentGrad)"/>

  <!-- ═════════════════════════════════════
       LEFT COLUMN  (safe x ≥ 120)
  ═════════════════════════════════════ -->

  <!-- Category tag -->
  <rect x="120" y="58" width="290" height="34" rx="5"
        fill="none" stroke="#38BDF8" stroke-width="1.6"/>
  <text x="265" y="80" font-size="12"
        fill="#38BDF8" font-weight="700" text-anchor="middle" letter-spacing="1.5">PRACTITIONER'S GUIDE · BPM + AI</text>

  <!-- Title -->
  <text x="120" y="176" font-size="70"
        fill="#F8FAFC" font-weight="900" letter-spacing="-1">The Working AI</text>

  <!-- Accent rule -->
  <rect x="120" y="188" width="430" height="5" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle — larger -->
  <text x="120" y="238" font-size="30"
        fill="#38BDF8" font-weight="700">Put to Task with Measured Output</text>

  <!-- Descriptor — larger -->
  <text x="120" y="284" font-size="21"
        fill="#94A3B8">A Practitioner's Guide to Placing AI</text>
  <text x="120" y="312" font-size="21"
        fill="#94A3B8">in Business Process</text>

  <!-- Pull-quote -->
  <rect x="120" y="344" width="468" height="130" rx="8"
        fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="344" x2="120" y2="474" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <text x="140" y="375" font-size="17"
        fill="#94A3B8" font-style="italic">&#x201C;AI without BPM is a worker without a job</text>
  <text x="140" y="402" font-size="17"
        fill="#94A3B8" font-style="italic">description; BPM without AI is a job description</text>
  <text x="140" y="429" font-size="17"
        fill="#94A3B8" font-style="italic">with the wrong workforce.&#x201D;</text>

  <!-- Author row -->
  <circle cx="140" cy="516" r="26" fill="#1D4ED8"/>
  <text x="140" y="522" font-size="16"
        fill="#ffffff" font-weight="800" text-anchor="middle">GS</text>
  <text x="178" y="510" font-size="16"
        fill="#F8FAFC" font-weight="700">Gary Samuelson</text>
  <text x="178" y="530" font-size="14"
        fill="#64748b">BPM &amp; Enterprise Architecture</text>

  <!-- Blog URL -->
  <text x="120" y="578" font-size="13"
        fill="#475569">garysamuelson.github.io</text>

  <!-- ═════════════════════════════════════
       RIGHT COLUMN — 5-Layer stack
       Box: x=700 w=310 cx=855  safe ≤1080
       Slot: h=76 box + 26 arrow = 102px × 5 = 510
       Start y=60, end y=570
  ═════════════════════════════════════ -->

  <!-- y1=60  y2=162  y3=264  y4=366  y5=468
       arrow gaps: 86→162, 248→264, 350→366, 452→468 -->

  <!-- Layer 1: Business Model -->
  <rect x="700" y="60" width="310" height="76" rx="8" fill="#1E293B" filter="url(#sh)"/>
  <text x="855" y="104" font-size="18"
        fill="#94A3B8" font-weight="700" text-anchor="middle" letter-spacing="1">BUSINESS MODEL</text>
  <line x1="855" y1="136" x2="855" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#mD)"/>

  <!-- Layer 2: Value Chain -->
  <rect x="700" y="162" width="310" height="76" rx="8" fill="#1E293B" filter="url(#sh)"/>
  <text x="855" y="206" font-size="18"
        fill="#94A3B8" font-weight="700" text-anchor="middle" letter-spacing="1">VALUE CHAIN</text>
  <line x1="855" y1="238" x2="855" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#mD)"/>

  <!-- Layer 3: Process Model -->
  <rect x="700" y="264" width="310" height="76" rx="8" fill="#1E293B" filter="url(#sh)"/>
  <text x="855" y="308" font-size="18"
        fill="#94A3B8" font-weight="700" text-anchor="middle" letter-spacing="1">PROCESS MODEL</text>
  <line x1="855" y1="340" x2="855" y2="364" stroke="#475569" stroke-width="2.5" marker-end="url(#mD)"/>

  <!-- Layer 4: Task -->
  <rect x="700" y="366" width="310" height="76" rx="8" fill="#1E293B" filter="url(#sh)"/>
  <text x="855" y="410" font-size="18"
        fill="#94A3B8" font-weight="700" text-anchor="middle" letter-spacing="1">TASK</text>
  <line x1="855" y1="442" x2="855" y2="466" stroke="#38BDF8" stroke-width="3" marker-end="url(#mB)"/>

  <!-- Layer 5: AI Worker — highlighted -->
  <rect x="700" y="468" width="310" height="96" rx="8" fill="#1D4ED8" filter="url(#glow)"/>
  <text x="855" y="508" font-size="22"
        fill="#ffffff" font-weight="900" text-anchor="middle" letter-spacing="1">AI WORKER</text>
  <text x="855" y="534" font-size="15"
        fill="#BFDBFE" text-anchor="middle">agent-as-worker · AI-inside</text>
  <text x="855" y="555" font-size="13"
        fill="#93C5FD" text-anchor="middle">the only layer that changes</text>

  <!-- "AI enters here" callout -->
  <line x1="1012" y1="516" x2="1046" y2="516" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1050" y="509" font-size="15" fill="#38BDF8" font-weight="700">AI</text>
  <text x="1050" y="527" font-size="15" fill="#38BDF8" font-weight="700">enters</text>
  <text x="1050" y="545" font-size="15" fill="#38BDF8" font-weight="700">here</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accentGrad)"/>

</svg>
